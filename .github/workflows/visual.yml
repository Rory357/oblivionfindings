name: visual-regression

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop
          - chromium-desktop-visual
          - it-security-desktop-1440
          - it-security-desktop-1280
        include:
          - project: governance-desktop-1366
            config: playwright.governance.config.ts
          - project: governance-desktop-1920
            config: playwright.governance.config.ts

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: oblivion_findings_visual
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: testUser
          MYSQL_PASSWORD: test101
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Assets
        run: npm run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Governed command journeys exercise the real signer. This key is
          # private to this disposable job and is never printed or uploaded.
          php -r '$keys = json_encode(["visual-ci" => base64_encode(random_bytes(SODIUM_CRYPTO_AUTH_KEYBYTES))], JSON_THROW_ON_ERROR); file_put_contents(".env", "\nMONITORING_SIGNING_KEY_ID=visual-ci\nMONITORING_SIGNING_KEYS=" . chr(39) . $keys . chr(39) . "\n", FILE_APPEND);'

      - name: Grant testUser global privileges
        run: |
          mysql --host=127.0.0.1 --port=3306 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'testUser'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Run Fresh Migrations And Seeders
        env:
          APP_ENV: ${{ matrix.project == 'chromium-desktop-visual' && 'testing' || 'local' }}
          VISUAL_FROZEN_NOW: ${{ matrix.project == 'chromium-desktop-visual' && '2026-10-05T00:00:00Z' || '' }}
          VISUAL_RANDOM_SEED: ${{ matrix.project == 'chromium-desktop-visual' && '20261005' || '' }}
          APP_URL: http://127.0.0.1:4173
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: oblivion_findings_visual
          DB_USERNAME: testUser
          DB_PASSWORD: test101
          BROADCAST_CONNECTION: log
          CACHE_STORE: array
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
        run: |
          if [[ "${{ matrix.project }}" == chromium-desktop-visual ]]; then
            php tests/visual/artisan.php migrate:fresh --seed --force
          else
            php artisan migrate:fresh --seed --force
          fi

      - name: Visual Regression (${{ matrix.project }})
        timeout-minutes: 50
        env:
          APP_ENV: ${{ matrix.project == 'chromium-desktop-visual' && 'testing' || 'local' }}
          VISUAL_FROZEN_NOW: ${{ matrix.project == 'chromium-desktop-visual' && '2026-10-05T00:00:00Z' || '' }}
          VISUAL_RANDOM_SEED: ${{ matrix.project == 'chromium-desktop-visual' && '20261005' || '' }}
          PLAYWRIGHT_SKIP_RESEED: ${{ matrix.project == 'chromium-desktop-visual' && 'true' || 'false' }}
          APP_URL: http://127.0.0.1:4173
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: oblivion_findings_visual
          DB_USERNAME: testUser
          DB_PASSWORD: test101
          BROADCAST_CONNECTION: log
          CACHE_STORE: array
          MAIL_MAILER: array
          PLAYWRIGHT_PORT: 4173
          QUEUE_CONNECTION: sync
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 0
          REDIS_CACHE_DB: 1
          REDIS_QUEUE_RETRY_AFTER: 960
          SESSION_DRIVER: file
          FEATURE_ROSTERING_PUBLISH: true
          FEATURE_ROSTERING_AUTO_SCHEDULE: true
          VISUAL_EMAIL: admin@demo.test
          VISUAL_PASSWORD: password
        run: |
          # Discovery explicitly uses Redis; its worker must share the browser's
          # database cache for unique job locks. Other workloads keep sync.
          if [[ "${{ matrix.project }}" == it-security-* ]]; then
            CACHE_STORE=database php artisan queue:work redis --queue=monitoring-discovery --sleep=1 --tries=1 --timeout=900 --max-time=3300 --no-interaction > storage/logs/visual-discovery-worker.log 2>&1 &
            discovery_worker_pid=$!
            trap 'kill "$discovery_worker_pid" 2>/dev/null || true; wait "$discovery_worker_pid" 2>/dev/null || true' EXIT
          fi
          npx playwright test --config=${{ matrix.config || 'playwright.config.ts' }} --project=${{ matrix.project }}

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.project }}
          path: |
            playwright-report
            playwright-report-governance
            test-results
