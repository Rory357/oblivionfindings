name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: foundation
            shard_index: 0
            shard_count: 1
            batch_size: 30
          - suite: feature
            shard_index: 0
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 1
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 2
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 3
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 4
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 5
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 6
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 7
            shard_count: 8
            batch_size: 12

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: oblivion_findings_codex_test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: testUser
          MYSQL_PASSWORD: test101
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Assets
        run: npm run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # The TestCase creates a per-process isolated MySQL database via PDO at
      # runtime (DB_DATABASE_<pid>). That requires testUser to have CREATE
      # privilege globally, which the default MYSQL_USER setup doesn't grant.
      - name: Grant testUser global privileges
        run: |
          mysql --host=127.0.0.1 --port=3306 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'testUser'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Crash-safe tests (${{ matrix.suite }} ${{ matrix.shard_index }}/${{ matrix.shard_count }})
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: oblivion_findings_codex_test
          DB_USERNAME: testUser
          DB_PASSWORD: test101
        run: >-
          php scripts/ci/run-pest-shard.php
          --suite=${{ matrix.suite }}
          --shard-index=${{ matrix.shard_index }}
          --shard-count=${{ matrix.shard_count }}
          --batch-size=${{ matrix.batch_size }}
