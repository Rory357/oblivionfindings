name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: foundation
            shard_index: 0
            shard_count: 1
            batch_size: 30
          # Run the complete medication gate files even when a broad feature
          # shard stops earlier on an unrelated module's failing batch.
          - suite: emar-release
            shard_index: 0
            shard_count: 1
            batch_size: 1
          - suite: feature
            shard_index: 0
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 1
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 2
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 3
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 4
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 5
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 6
            shard_count: 8
            batch_size: 12
          - suite: feature
            shard_index: 7
            shard_count: 8
            batch_size: 12

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: oblivion_findings_codex_test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: testUser
          MYSQL_PASSWORD: test101
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Assets
        run: npm run build

      - name: Guard retired Today navigation
        if: matrix.suite == 'foundation'
        run: npx vitest run resources/js/components/today-retirement.test.tsx

      - name: Check medication desktop types and workflows
        if: matrix.suite == 'foundation'
        run: |
          npx tsc --noEmit
          npx vitest run resources/js/pages/emar resources/js/lib/emar-navigation.test.ts resources/js/pages/settings/profile.test.tsx

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # The TestCase creates a per-process isolated MySQL database via PDO at
      # runtime (DB_DATABASE_<pid>). That requires testUser to have CREATE
      # privilege globally, which the default MYSQL_USER setup doesn't grant.
      - name: Grant testUser global privileges
        run: |
          mysql --host=127.0.0.1 --port=3306 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'testUser'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Crash-safe tests (${{ matrix.suite }} ${{ matrix.shard_index }}/${{ matrix.shard_count }})
        if: matrix.suite != 'emar-release'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: oblivion_findings_codex_test
          DB_USERNAME: testUser
          DB_PASSWORD: test101
        run: >-
          php scripts/ci/run-pest-shard.php
          --suite=${{ matrix.suite }}
          --shard-index=${{ matrix.shard_index }}
          --shard-count=${{ matrix.shard_count }}
          --batch-size=${{ matrix.batch_size }}

      - name: Install protected-backup PDF verifier
        if: matrix.suite == 'emar-release'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qpdf
          test -x /usr/bin/qpdf

      - name: Medication and connected-care release gates
        if: matrix.suite == 'emar-release'
        env:
          EMAR_BACKUP_QPDF_PATH: /usr/bin/qpdf
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: oblivion_findings_codex_test
          DB_USERNAME: testUser
          DB_PASSWORD: test101
        run: >-
          php vendor/bin/pest
          tests/Feature/Emar/PackLedgerIntegrationTest.php
          tests/Feature/Emar/StockPacksWorkflowTest.php
          tests/Feature/Emar/StockManagementTest.php
          tests/Feature/Emar/StockManagementPaginationTest.php
          tests/Feature/Emar/ControlledProductTest.php
          tests/Feature/FleetAssets/ResidentTransportMedicationTransitTest.php
          tests/Feature/FleetAssets/ResidentTransportJourneySecurityTest.php
          tests/Feature/Console/CheckMedicationStockCommandTest.php
          tests/Feature/Emar/MedicationOverviewServiceTest.php
          tests/Feature/Emar/MedicationHistoricalRecoveryTest.php
          tests/Feature/Emar/MedicationDowntimeTest.php
          tests/Feature/Emar/ForgottenWitnessPinTest.php
          tests/Feature/Emar/ActualAbsenceLifecycleTest.php
          tests/Feature/Emar/AwayDosesTest.php
          tests/Unit/Support/MedicationWorkflowDefaultsTest.php
          tests/Feature/Emar/GuidedRoundOfflineReplayTest.php
          tests/Feature/Emar/P01RecordingContractTest.php
          tests/Feature/Medication/ControlledDrugStockTruthTest.php
          tests/Unit/MedicationPaperRecoveryMigrationTest.php
          tests/Feature/Emar/DoseTimingSettingsTest.php
          tests/Feature/It/ItTicketTriageTest.php
          tests/Feature/Incidents/IncidentJourneyPresenterTest.php
          tests/Feature/FrontlineLifecycleDemoSeederReplayTest.php
          tests/Feature/Emar/ConnectedMedicationPermissionSeedingTest.php
          tests/Feature/Emar/PharmacyConnectionTest.php
          tests/Feature/Emar/ExternalClinicalAccessTest.php
          tests/Feature/Emar/ProviderMedicationTransferTest.php
          tests/Feature/Emar/MedicineCatalogueWorkflowTest.php
          tests/Feature/Emar/MedicationBackupDeliveryTest.php
          tests/Feature/Emar/BackupEmailConfigurationTest.php
          tests/Feature/It/ItEmailConfigurationTest.php
          tests/Feature/It/ItMailboxSettingsTest.php
          tests/Feature/It/ItSupportMailboxTransportTest.php
          tests/Feature/Auth/AuthenticationTest.php
          tests/Feature/Auth/EmailVerificationTest.php
          tests/Feature/Auth/TwoFactorChallengeTest.php
          tests/Feature/Settings/TwoFactorAuthenticationTest.php
          tests/Unit/Medication/PharmacyConnect/PharmacyProtocolTest.php
          tests/Unit/Medication/ExternalClinicalPrescriptionTest.php
          tests/Unit/Medication/ExternalClinicalTwoFactorResponseTest.php
          tests/Unit/Medication/ExternalClinicalWitnessSecretTest.php
          tests/Unit/Medication/CatalogueDatasetTest.php
          tests/Unit/Medication/BackupScheduleClockTest.php
          tests/Unit/Medication/BackupPdfEncryptionTest.php
          --log-junit storage/logs/emar-release-gates.xml

      - name: Retain medication gate results
        if: always() && matrix.suite == 'emar-release'
        uses: actions/upload-artifact@v4
        with:
          name: emar-release-gates
          path: storage/logs/emar-release-gates.xml
          if-no-files-found: warn
