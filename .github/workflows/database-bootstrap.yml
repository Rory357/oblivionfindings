name: database-bootstrap

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mysql-bootstrap:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: oblivion_findings
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: testUser
          MYSQL_PASSWORD: test101
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Assets
        run: npm run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # MySQL requires SUPER for CREATE TRIGGER while binary logging is enabled
      # unless a server administrator explicitly trusts trigger creators. Keep
      # the migration account unprivileged and provision the narrow server
      # prerequisite used by the lifecycle/history guard migrations.
      - name: Permit trusted trigger creation
        run: |
          mysql --host=127.0.0.1 --port=3306 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = ON;"

      - name: Run Fresh Migrations And Seeders
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: oblivion_findings
          DB_USERNAME: testUser
          DB_PASSWORD: test101
          # Avoid Redis (no service) — keep queue/cache/broadcast in-memory.
          # FleetDemoSeeder triggers events that would otherwise queue to Redis.
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
          BROADCAST_CONNECTION: log
          SESSION_DRIVER: array
        run: php artisan migrate:fresh --seed --force
