<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#bgGradient)"/>
  
  <!-- Document/Page representing records/memories -->
  <path d="M55 45h90a8 8 0 0 1 8 8v94a8 8 0 0 1-8 8H55a8 8 0 0 1-8-8V53a8 8 0 0 1 8-8z" fill="white" fill-opacity="0.95"/>
  
  <!-- Code brackets </> representing IT -->
  <path d="M70 95l-12 12 12 12M90 119l10-48M110 95l12 12-12 12" stroke="url(#codeGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ribbon bookmark representing care and preservation -->
  <path d="M130 45v75l-15-10-15 10V45" fill="url(#ribbonGradient)"/>
  
  <!-- Subtle circuit/node accent -->
  <circle cx="160" cy="160" r="6" fill="white" fill-opacity="0.4"/>
  <circle cx="145" cy="170" r="4" fill="white" fill-opacity="0.3"/>
  <path d="M154 164l-9 6" stroke="white" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>
  
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="codeGradient" x1="70" y1="71" x2="122" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="ribbonGradient" x1="100" y1="45" x2="130" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
</svg>