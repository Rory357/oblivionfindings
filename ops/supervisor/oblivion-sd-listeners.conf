; Security & Devices listeners kept running by supervisor (Phase A, docs/security-devices/GOAL.md).
; Install once as root: see ops/supervisor/README.md. Deploys don't install or change this file.

[program:oblivion-sd-alarm-receiver]
command=php /var/www/oblivionfindings/artisan security-devices:listen-sia-dc09
directory=/var/www/oblivionfindings
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/var/log/oblivion/sd-alarm-receiver.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
