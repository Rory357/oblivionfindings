{id:'garden',title:'Growing good things, together',category:'Our people',image:'garden',date:'12 Oct 2026',author:'Mia Thompson',summary:'A little teamwork. A greener space. Meet the people behind our community garden.',body:['It started with an idea over a cup of tea: a shared garden where colleagues could learn, grow and spend time together.','Last Friday, teams from across our sites joined the first planting day. Herbs, spring vegetables and native plants now fill the garden beds, with plenty of room for the next round of ideas.','Thank you to everyone who helped with planning, planting and the well-earned afternoon tea. Our next garden afternoon is on 23 October. Everyone is welcome.']},
{id:'learning',title:'Small ideas, better days',category:'Learning & development',image:'team',date:'9 Oct 2026',author:'Sam Walker',summary:'Meet the new peer-learning circles, built around practical ideas from our teams.',body:['The best ideas often come from the people doing the work every day. Our new peer-learning circles create time to share those ideas.','Each monthly session brings together a small group of colleagues to discuss one practical topic. The first sessions cover useful handovers, building confidence and making space for feedback.','Choose a session that suits you from the events board. Bring a question, a useful idea or simply your curiosity.']},

function render(){const canvasScroll=root.querySelector('.hc-designer>div:first-child')?.scrollTop||0,propertyScroll=root.querySelector('.hc-propbody')?.scrollTop||0;root.dataset.theme=state.theme;root.dataset.editing=isEditing();root.style.setProperty('--hc-gap',design.spacing+'px');root.style.setProperty('--hc-radius',design.corners+'px');app.innerHTML=shell();if(isEditing()){const stage=root.querySelector('.hc-designer>div:first-child');if(stage)stage.scrollTop=canvasScroll;const props=root.querySelector('.hc-propbody');if(props)props.scrollTop=propertyScroll;}icons();}
function sectionMarkup(s,editing=false){return `<section class="hc-section" data-section="${s.id}" data-tone="${s.tone}" aria-label="${esc(s.name)}">${editing?`<div class="hc-section-tools">${IB('Move section '+s.name,'section-drag','grip-vertical',s.id,'data-section-drag="'+s.id+'"')}<button class="hc-textbtn" data-action="section-settings" data-value="${s.id}">${esc(s.name)}</button>${IB('Move section up','section-up','arrow-up',s.id)}${IB('Move section down','section-down','arrow-down',s.id)}${IB('Section settings','section-settings','settings-2',s.id)}${IB('Remove section','section-delete','trash-2',s.id)}</div>`:''}<div class="hc-section-grid" data-grid="${s.id}">${s.blocks.filter(b=>editing||!b.hidden).map(b=>blockMarkup(b,editing)).join('')}</div>${editing?`<button class="hc-addblock" data-action="library" data-value="${s.id}">${I('plus')}Add a block</button>`:''}</section>`;}
function blockMarkup(b,editing=false){const h=!['featured','image'].includes(b.type);return `<article class="hc-block ${selected?.id===b.id?'is-selected':''}" data-block="${b.id}" data-type="${b.type}" data-tone="${b.tone}" style="grid-column:span ${b.width};min-height:${b.height||0}px;${b.hidden?'opacity:.5':''}" aria-label="${esc(b.title)}">${editing?`<div class="hc-blocktools"><button class="hc-iconbtn hc-grip" data-drag="${b.id}" aria-label="Move ${esc(b.title)}" aria-describedby="hc-keyboard-help">${I('grip-vertical')}</button><span>${esc(library[b.type].name)}</span>${IB('Configure '+b.title,'select','settings-2',b.id)}${IB('Duplicate '+b.title,'duplicate','copy',b.id)}${IB('Remove '+b.title,'remove','x',b.id)}</div>`:''}${h?`<div class="hc-block-head"><h2>${esc(b.title)}</h2>${['news','shoutouts','events','resources'].includes(b.type)?TB('See all','nav',b.type):''}</div>`:''}<div class="hc-block-body" ${editing?'inert':''}>${blockContent(b)}</div>${editing?`<div class="hc-block-foot"><span>${widthName(b.width)}${b.hidden?' · Hidden':''}</span><button class="hc-resize" data-resize="${b.id}" aria-label="Resize ${esc(b.title)}" aria-describedby="hc-keyboard-help">${I('move-diagonal-2')}</button></div>`:''}</article>`;}
function feature(b){return `<div class="hc-feature" data-variant="${b.layout}"><button class="hc-photo-tile" data-action="story" data-value="garden">${photo(b.image)}<div class="hc-feature-copy"><span class="hc-label">Our people · Featured story</span><h2>${esc(b.title)}</h2><p>${esc(b.text||stories[0].summary)}</p><span class="hc-feature-foot"><span class="hc-feature-byline">${avatar('Mia Thompson')}<span>Mia Thompson · 3 min read</span></span><span class="hc-row">Read story <span class="hc-read-arrow">${I('arrow-up-right')}</span></span></span></div></button><div class="hc-feature-side">${stories.slice(1).map(s=>`<button class="hc-photo-tile" data-action="story" data-value="${s.id}">${photo(s.image)}<div class="hc-feature-copy"><span class="hc-label">${s.category}</span><h3>${s.title}</h3><span class="hc-feature-side-meta">${s.date}${I('arrow-up-right')}</span></div></button>`).join('')}</div></div>`;}
function newsMarkup(items,layout='cards'){return `<div class="hc-news-grid" data-layout="${layout}">${items.map(s=>`<button class="hc-news-card" data-action="story" data-value="${esc(s.id)}">${photo(s.image)}<span class="hc-category">${esc(s.category)}</span><h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p><span class="hc-news-meta">${avatar(s.author)}<span>${esc(s.author)}</span><span class="hc-muted">${esc(s.date.replace(' 2026',''))}</span></span></button>`).join('')}</div>`;}
function shoutList(count=2){const list=[...state.shouts,{id:'maya',name:'Maya Chen',by:'Daniel Brooks',team:'Harbour House',text:'Thank you for the care and patience you brought to welcoming our new colleagues. You made a busy week feel calm and supported.',value:'Working together',count:18},{id:'team',name:'Kōwhai House team',by:'Priya Nair',team:'Kōwhai House',text:'A huge thank-you for making my first week such a warm one. Every question was welcomed, and every little check-in made a difference.',value:'Showing kindness',count:12}];return list.slice(0,count).map(s=>`<div class="hc-shout"><div class="hc-person">${avatar(s.name)}<div><b>${esc(s.name)}</b><small>${esc(s.team)} · From ${esc(s.by)}</small></div>${I('sparkles')}</div><p>“${esc(s.text)}”</p><div class="hc-row hc-between"><span class="hc-tag">${esc(s.value)}</span><button class="hc-textbtn" data-action="applause" data-value="${s.id}" aria-pressed="${state.applause.includes(s.id)}">${I('heart')} ${s.count+(state.applause.includes(s.id)?1:0)} · ${state.applause.includes(s.id)?'Appreciated':'Appreciate'}</button></div></div>`).join('');}
function eventList(items=events){return items.map(e=>`<button class="hc-event" data-action="event" data-value="${e.id}"><span class="hc-date"><small>${e.month}</small><b>${e.day}</b></span><span class="hc-event-copy">${e.id===events[0].id?'<span class="hc-event-label">Next up</span>':''}<h3>${e.title}</h3><p>${e.time}</p><span class="hc-event-place">${e.place}</span>${state.going.includes(e.id)?'<span class="hc-tag success" style="margin-top:7px">You’re going</span>':''}</span>${I('chevron-right')}</button>`).join('');}
function resourceList(items=resources){return items.map(r=>`<button class="hc-resource" data-action="resource" data-value="${r.id}">${I('file-text')}<span><b>${r.title}</b><small>${r.kind} · ${r.owner}</small></span>${I('arrow-up-right')}</button>`).join('');}
function pollMarkup(b){const labels=(b.options||'A shared morning tea\nA walk & talk\nA practical learning session').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,5),key=b.id+':'+b.text+':'+labels.join('|'),choice=state.polls?.[key];return `<div class="hc-poll"><p>${esc(b.text)}</p>${choice===undefined?`<form data-poll="${b.id}">${labels.map((label,i)=>`<label class="hc-poll-option"><input type="radio" name="poll-answer" value="${i}" required>${esc(label)}</label>`).join('')}<button type="button" class="hc-btn primary" data-action="vote" data-value="${b.id}">Submit vote ${I('arrow-right')}</button></form><p class="hc-small hc-muted" style="margin-top:12px;margin-bottom:0">Share your view with the team</p>`:labels.map((label,i)=>{const votes=labels.map((_,j)=>([18,12,8,6,4][j]||0)+(j===choice?1:0)),total=votes.reduce((a,b)=>a+b,0),pc=Math.round(votes[i]/total*100);return `<div class="hc-poll-result"><div class="hc-row hc-between"><span>${esc(label)}${i===choice?' ✓':''}</span><b>${pc}%</b></div><div class="hc-poll-track"><span style="width:${pc}%"></span></div></div>`}).join('')+'<p class="hc-small hc-muted" style="margin-top:14px;margin-bottom:0">Thanks for voting · Sample results</p>'}</div>`;}

function blockContent(b){switch(b.type){
case 'featured':return feature(b);
case 'news':return newsMarkup(stories.filter(s=>b.filter==='all'||s.category===b.filter).slice(-b.count),b.layout);
case 'links':return `<div class="hc-links" data-layout="${b.layout}">${b.links.split('\n').filter(Boolean).slice(0,8).map((line,i)=>{const [label,sub]=line.split('|').map(x=>x.trim());return `<button class="hc-link-tile" data-action="destination" data-value="${esc(label)}"><span class="hc-link-glyph">${I(['users-round','book-open','graduation-cap','message-circle'][i%4])}</span><span class="hc-link-copy">${esc(label)}<small>${esc(sub||'Open resource')}</small></span><span class="hc-link-arrow">${I('arrow-up-right')}</span></button>`}).join('')}</div>`;
case 'shoutouts':return shoutList(b.count);
case 'events':return eventList(events.slice(0,b.count));
case 'people':return `<div class="hc-people">${people.map((p,i)=>({...p,originalIndex:i})).filter(p=>p.icon!=='cake'||(state.birthdaySharing||[]).includes('aroha')).slice(0,b.count).map((p,i)=>`<button class="hc-personcard" data-action="person" data-value="${p.originalIndex??i}"><span class="hc-person-top">${avatar(p.name)}<span class="hc-celebration-mark">${I(p.icon)}</span></span><b>${p.name}</b><span class="hc-small" style="color:var(--hc-brand-ink)">${p.note}</span><small>${p.detail.split(' · ')[0]}</small></button>`).join('')}</div>`;
case 'poll':return pollMarkup(b);
case 'resources':return resourceList(resources.slice(0,b.count));
case 'text':return `<div class="hc-prose">${esc(b.text)}</div>`;
case 'image':return photo(b.image,b.title)+`<div class="hc-image-caption"><h3 style="font-size:14px">${esc(b.title)}</h3><p class="hc-small hc-muted">${esc(b.text)}</p></div>`;
case 'notice':return `<div class="hc-notice">${I('megaphone')}<div><p>${esc(b.text)}</p></div></div>`;
case 'button':return `<div class="hc-stack"><p class="hc-small hc-muted">${esc(b.text||'Find the information you need, when you need it.')}</p>${B(esc(b.button),'destination','arrow-right','primary',b.destination)}</div>`;
default:return '';}}
function reading(){const doc=activeDoc(),title={news:'Company news',shoutouts:'Good work deserves a shout-out',events:'Make time to connect',resources:'Everyday essentials',saved:'Saved for later'};let content='';if(query){const q=query.toLowerCase();let items=stories.filter(s=>(s.title+' '+s.summary+' '+s.category).toLowerCase().includes(q));if(state.tab==='saved')items=items.filter(s=>state.bookmarks.includes('story:'+s.id));const rs=resources.filter(r=>(state.tab!=='saved'||state.bookmarks.includes('resource:'+r.id))&&(r.title+' '+r.summary).toLowerCase().includes(q));const ev=companyEvents().filter(e=>(state.tab!=='saved'||state.bookmarks.includes('event:'+e.id))&&(e.title+' '+e.description).toLowerCase().includes(q));content=`<div class="hc-viewtitle"><div><h2>Search results</h2><p>Results for “${esc(query)}”</p></div>${TB('Clear search','clear-search','','x')}</div>${items.length?newsMarkup(items):''}${rs.length?`<div style="margin-top:20px">${resourceList(rs)}</div>`:''}${ev.length?`<div style="margin-top:20px">${eventList(ev)}</div>`:''}${!items.length&&!rs.length&&!ev.length?'<div class="hc-empty"><h3>No matches yet</h3><p>Try a topic, a resource name or a shorter phrase.</p></div>':''}`;}else if(state.tab==='home'){content=`<div class="hc-board">${doc.sections.map(s=>sectionMarkup(s)).join('')}</div>`;}else{let inner='';if(state.tab==='news')inner=newsMarkup(stories);if(state.tab==='shoutouts')inner=shoutList(10);if(state.tab==='events')inner=eventList();if(state.tab==='resources')inner=resourceList();if(state.tab==='saved'){const ss=stories.filter(s=>state.bookmarks.includes('story:'+s.id)),ee=events.filter(e=>state.bookmarks.includes('event:'+e.id)),rr=resources.filter(r=>state.bookmarks.includes('resource:'+r.id));inner=ss.length?newsMarkup(ss):'';if(ee.length)inner+=`<div style="margin-top:24px">${eventList(ee)}</div>`;if(rr.length)inner+=`<div style="margin-top:24px">${resourceList(rr)}</div>`;if(!inner)inner=`<div class="hc-empty">${I('bookmark')}<h3>Keep something good for later</h3><p>Save a story, resource or event and you’ll find it here.</p><div style="margin-top:18px">${B('Explore news','nav','arrow-right','','news')}</div></div>`;}content=`<div class="hc-viewtitle"><div><h2>${title[state.tab]}</h2><p>${state.tab==='saved'?'Your private collection. The hub layout is shared by everyone.':state.tab==='shoutouts'?'Celebrate the people who make a difference.':'From across our company.'}</p></div>${state.tab==='shoutouts'?B('Give a shout-out','recognise','heart-handshake','primary'):''}</div><div class="hc-reading-content">${inner}</div>`;}
return `${preview?`<div class="hc-previewbar"><span class="hc-row">${I('eye')}Previewing your unpublished changes</span>${B('Back to designer','preview-back','pencil')}</div>`:`<div class="hc-command"><span class="hc-row">${I('globe')}One shared hub <span>·</span> All staff</span><div class="hc-row">${B('Give a shout-out','recognise','heart-handshake','ghost')}${state.role==='editor'?`${state.draft?'<span class="hc-tag">Draft saved</span>':''}${B(state.draft?'Continue editing':'Edit page','edit','pencil','',null)}`:''}</div></div>`}${content}<footer class="hc-pagefoot"><span>Company Hub · Managed by the People & Culture team</span><span>Shared design · Version ${state.revision}</span></footer>`;}
function widthName(n){return {4:'⅓ width',6:'½ width',8:'⅔ width',12:'Full width'}[n]||'Full width'}
function editor(){return `<div class="hc-editorbar"><div class="hc-editlabel"><strong>Design your company hub</strong><small>${history.length?'Unsaved changes':'One shared layout · All staff'}</small></div>${IB('Undo','undo','undo-2','',''+(!history.length?'disabled':''))}${IB('Redo','redo','redo-2','',''+(!future.length?'disabled':''))}${B('Preview','preview','eye')}${B('Cancel','cancel','','ghost')}${B('Save draft','save-draft','save')}${B('Publish','publish','check','primary')}</div><div class="hc-designer"><div><div class="hc-canvas"><div class="hc-canvas-top"><span class="hc-row">${I('mouse-pointer-2')}Drag a grip · Resize a corner</span>${TB('Add blocks','library',edit.sections[0]?.id,'plus')}</div><div class="hc-board">${edit.sections.map(s=>sectionMarkup(s,true)).join('')}</div><button class="hc-addsection" data-action="add-section">${I('plus')}Add a section</button><div id="hc-keyboard-help" class="hc-sr">Move a block: press Space on its move handle, then use arrow keys, Enter to place or Escape to cancel. Resize: use Left and Right for width and Up and Down for height. The properties panel also offers width and section controls.</div></div><p class="hc-editstatus">${edit.sections.length} sections · ${edit.sections.reduce((n,s)=>n+s.blocks.length,0)} blocks · Changes appear for everyone after you publish.</p></div>${properties()}</div>`;}
function field(label,key,value,kind='text',options=[]){return `<label class="hc-field">${label}${kind==='select'?`<select data-prop="${key}" aria-label="${esc(label)}">${options.map(o=>`<option value="${esc(Array.isArray(o)?o[0]:o)}" ${String(value)===String(Array.isArray(o)?o[0]:o)?'selected':''}>${esc(Array.isArray(o)?o[1]:o)}</option>`).join('')}</select>`:kind==='textarea'?`<textarea data-prop="${key}" aria-label="${esc(label)}" rows="4" maxlength="600">${esc(value)}</textarea>`:`<input data-prop="${key}" aria-label="${esc(label)}" type="${kind}" value="${esc(value)}" ${kind==='number'?'min="0" max="800" step="24"':'maxlength="120"'}>`}</label>`;}
function inspectorTabs(){return `<nav class="hc-inspector-tabs" aria-label="Designer panel">${[['settings','Settings','sliders-horizontal'],['outline','Page outline','list-tree']].map(([key,label,icon])=>`<button type="button" data-action="inspector-tab" data-value="${key}" aria-pressed="${inspectorMode===key}">${I(icon)}${label}</button>`).join('')}</nav>`;}
function widthControls(b){return `<div class="hc-field"><span>Block width</span><div class="hc-widths" aria-label="Block width">${[[4,'⅓','One third'],[6,'½','Half'],[8,'⅔','Two thirds'],[12,'Full','Full width']].map(([value,label,name])=>`<button type="button" class="hc-widthchoice" data-action="set-width" data-value="${value}" aria-label="${name}" aria-pressed="${b.width===value}"><span class="hc-width-track" aria-hidden="true"><span style="width:${value/12*100}%"></span></span>${label}</button>`).join('')}</div></div>`;}
function sectionPresets(){return `<div class="hc-preset-grid" aria-label="Section column presets">${[['full','Full width',[1]],['halves','Equal halves',[1,1]],['thirds','Three columns',[1,1,1]],['wide-left','Wide + narrow',[2,1]]].map(([key,label,columns])=>`<button type="button" class="hc-preset" data-action="apply-preset" data-value="${key}"><span class="hc-mini-columns" aria-hidden="true">${columns.map(n=>`<span style="flex:${n}"></span>`).join('')}</span>${label}</button>`).join('')}</div>`;}
function properties(){
  if(inspectorMode==='outline')return `<aside class="hc-properties" aria-label="Designer properties">${inspectorTabs()}<div class="hc-prophead"><span>Your page at a glance</span><span class="hc-small hc-muted">${edit.sections.length} sections</span></div><div class="hc-propbody">${edit.sections.map(s=>`<div class="hc-outline-section"><button class="hc-outline-heading" data-action="outline-section" data-value="${s.id}">${I('layout-panel-top')}${esc(s.name)}<small>${s.blocks.length}</small></button>${s.blocks.map(b=>`<button class="hc-outline-item" data-action="outline-select" data-value="${b.id}" aria-pressed="${selected?.id===b.id}">${I(library[b.type].icon)}<span>${esc(b.title)}</span>${b.hidden?I('eye-off'):`<small>${widthName(b.width).replace(' width','')}</small>`}</button>`).join('')}${TB('Add block','library',s.id,'plus')}</div>`).join('')}<div class="hc-propgroup">${B('Add section','add-section','plus')}</div></div></aside>`;
  let content='',label='Page settings';
  const b=selected?.kind==='block'?blockFind(selected.id)?.b:null,s=selected?.kind==='section'?edit.sections.find(s=>s.id===selected.id):null;
  if(b){
    label=library[b.type].name;
    content=`${field('Heading','title',b.title)}
      ${['featured','text','notice','poll','image','button'].includes(b.type)?field(b.type==='poll'?'Question':'Message','text',b.text,'textarea'):''}
      ${['featured','image'].includes(b.type)?`<div class="hc-field">Image<div class="hc-swatch-images">${Object.keys(assets).map(k=>`<button data-action="image" data-value="${k}" aria-label="Use ${k} image" aria-pressed="${b.image===k}">${photo(k,k)}</button>`).join('')}</div></div>`:''}
      ${b.type==='poll'?field('Answer options · one per line','options',b.options||'A shared morning tea\nA walk & talk\nA practical learning session','textarea'):''}
      ${b.type==='links'?field('Links · one “Title | Description” per line','links',b.links,'textarea'):''}
      ${b.type==='button'?field('Button label','button',b.button)+field('Destination','destination',b.destination,'select',['Resources','People directory','Learning','Events']):''}
      ${b.type==='news'?field('Category','filter',b.filter,'select',[['all','All company news'],...stories.map(s=>[s.category,s.category])]):''}
      ${['news','events','shoutouts','people','resources'].includes(b.type)?field('Items to show','count',b.count,'select',[[1,'1 item'],[2,'2 items'],[3,'3 items'],[4,'4 items']]):''}
      <div class="hc-propgroup"><h3>Layout & appearance</h3>${widthControls(b)}
      ${['featured','news','links'].includes(b.type)?field('Presentation','layout',b.layout,'select',b.type==='featured'?[['mosaic','Lead + two stories'],['equal','Equal split'],['single','One large story']]:[['cards','Cards'],['list','List']]):''}
      ${field('Minimum height (px)','height',b.height,'number')}${field('Background','tone',b.tone,'select',[['plain','Standard surface'],['soft','Brand tint']])}
      ${field('Move to section','section',blockFind(b.id).s.id,'select',edit.sections.map(s=>[s.id,s.name]))}
      <label class="hc-checkbox"><input type="checkbox" data-prop="hidden" ${b.hidden?'checked':''}>Hide from staff</label></div>
      <div class="hc-two">${B('Duplicate','duplicate','copy','',b.id)}${B('Remove','remove','trash-2','',b.id)}</div>`;
  }else if(s){
    label='Section settings';content=field('Section name','name',s.name)+field('Section background','tone',s.tone,'select',[['plain','Page background'],['soft','Brand tint']])+`<div class="hc-propgroup"><h3>Arrange blocks</h3>${sectionPresets()}<p class="hc-small hc-muted">Choose a starting layout, then resize individual blocks to suit.</p>${B('Add a block','library','plus','',s.id)}${B('Remove section','section-delete','trash-2','',s.id)}</div>`;
  }else{
    content=`<span class="hc-tag">One shared page · All staff</span>${field('Hub title','title',edit.title)}${field('Description','tagline',edit.tagline,'textarea')}<div class="hc-propgroup"><h3>Make it yours</h3><p class="hc-small hc-muted">Choose a block on the page to change its content and appearance. Use the page outline to jump between sections.</p>${B('Browse blocks','library','panels-top-left')}${B('Add section','add-section','plus')}${TB('Designer shortcuts','designer-help','','keyboard')}</div><div class="hc-propgroup"><h3>Publishing</h3><p class="hc-small hc-muted">Drafts are for editors. Publishing updates the shared page for all staff.</p><div class="hc-small hc-muted">People & Culture · Version ${state.revision}${state.draft?'<br>A saved draft is available.':''}</div>${TB('Restore starting design','reset','','rotate-ccw')}</div>`;
  }
  return `<aside class="hc-properties" aria-label="Designer properties">${inspectorTabs()}<div class="hc-prophead"><span>${esc(label)}</span>${selected?IB('Page settings','page-settings','settings-2'):I('sliders-horizontal')}</div><div class="hc-propbody">${content}</div></aside>`;
}
function refreshCanvas(){const board=root.querySelector('.hc-canvas .hc-board');if(board)board.innerHTML=edit.sections.map(s=>sectionMarkup(s,true)).join('');const title=root.querySelector('.hc-hero h1');if(title)title.textContent=edit.title;const label=root.querySelector('.hc-editlabel small');if(label)label.textContent='Unsaved changes';root.querySelector('[data-action="undo"]').disabled=!history.length;root.querySelector('[data-action="redo"]').disabled=!future.length;icons();}
function refreshProps(){const old=root.querySelector('.hc-properties');if(old)old.outerHTML=properties();root.querySelectorAll('[data-block]').forEach(el=>el.classList.toggle('is-selected',selected?.id===el.dataset.block));icons();}
function openDialog(title,subtitle,body,footer='',kind=''){const wasOpen=dialog.open;dialogKind=kind;dialog.innerHTML=`<div class="hc-dialog-head"><div><h2 id="hc-dialog-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${IB('Close dialog','close','x')}</div><div class="hc-dialog-body">${body}</div>${footer?`<div class="hc-dialog-foot">${footer}</div>`:''}`;if(!wasOpen){dialog.showModal();root.scrollIntoView({block:'start'});}dialog.scrollTop=0;icons();}

  if(a==='inspector-tab'){inspectorMode=v==='outline'?'outline':'settings';refreshProps();return true;}
  if(a==='outline-select'||a==='outline-section'){
    selected={kind:a==='outline-select'?'block':'section',id:v};inspectorMode='settings';refreshProps();
    const el=root.querySelector(a==='outline-select'?'[data-block="'+v+'"]':'[data-section="'+v+'"]'),stage=root.querySelector('.hc-designer>div:first-child');
    if(el&&stage)stage.scrollTop+=el.getBoundingClientRect().top-stage.getBoundingClientRect().top-28;

  }

  if(a==='library-filter'){libraryFilter=['stories','people','essentials'].includes(v)?v:'all';showLibrary(librarySection);return true;}

}

function pagePublishDialog(){const issues=publicationIssues(edit),r=pageRecord(activePageId);openDialog(issues.length?'A little more before publishing':'Ready to publish this page?',activePageId?'Your page will be available to all staff.':'Your shared hub will update for all staff.',`${issues.length?`<div class="hc-page-error" role="alert">${issues.map(esc).join('<br>')}</div>`:''}<div class="hc-detailfacts"><span><small>Page</small>${esc(edit.title||'Untitled page')}</span><span><small>Visibility</small>All staff</span><span><small>Version</small>${activePageId?(r?.revision||0)+1:state.revision+1}</span><span><small>Appears in</small>${activePageId?(edit.kind==='story'&&edit.showInNews!==false?'Pages & company news':'Pages'):'Company Hub home'}</span></div>${!issues.length?`<div class="hc-publish-check">${I('check')}Hero and page content will be published together.</div><div class="hc-publish-check">${I('check')}Saved links keep opening the published page.</div>`:''}<p class="hc-small hc-muted" style="margin-top:17px">Publishing is simulated in this mockup.</p>`,B('Keep editing','close')+(!issues.length?B('Publish page','publish-content-page','check','primary'):''),'publish-page');}
handleAction=function(a,v,el){
  if(preview&&['nav','open-page','story','destination','hero-destination','notifications','global-search'].includes(a)){toast('Use Back to designer to leave this draft preview.');return;}
  if(a==='global-search'&&activePageId&&!edit){activePageId=null;state.tab='home';query='';render();root.querySelector('#hc-search-form input')?.focus();return;}
  if(['new-page','page-template','create-content-page','edit-content-page','edit-hero','hero-image','page-actions','duplicate-page','delete-page-draft','confirm-delete-page-draft','add-page-link','publish-content-page'].includes(a)&&state.role!=='editor')return;
  if(a==='new-page'){if(edit)return;createTemplate='story';creator();return;}
  if(a==='page-template'){const title=dialog.querySelector('#hc-new-page-title')?.value||'';createTemplate=['story','information','blank'].includes(v)?v:'story';creator(title);return;}
  if(a==='create-content-page'){const title=dialog.querySelector('#hc-new-page-title')?.value.trim();if(!title||title.length<3){dialog.querySelector('#hc-create-error').textContent='Use a clear title of at least 3 characters.';dialog.querySelector('#hc-new-page-title').focus();return;}const fresh=makeContentPage(title,createTemplate);activePageId=fresh.id;edit=fresh.d;selected={kind:'page'};inspectorMode='settings';newPagePending=true;history=[clone(edit)];future=[];preview=false;state.tab='pages';close();render();returnToTop();return;}
  if(a==='open-page'){if(isEditing())return;openPage(v);return;}
  if(a==='edit-content-page'){editContentPage(v);return;}
  if(a==='page-filter'){pageFilter=v;render();return;}
  if(a==='page-jump'){root.querySelector('[data-block="'+v+'"]')?.scrollIntoView({block:'start'});return;}
  if(a==='page-bookmark'){state.bookmarks.includes(v)?state.bookmarks=state.bookmarks.filter(x=>x!==v):state.bookmarks.push(v);persist();render();toast(state.bookmarks.includes(v)?'Saved for later.':'Removed from your saved pages.');return;}
  if(a==='destination'&&v?.startsWith('page:')){openPage(v.slice(5));return;}
  if(a==='hero-destination'){if(v.startsWith('page:'))openPage(v.slice(5));else{activePageId=null;state.tab=v;query='';render();returnToTop();}return;}
  if(a==='edit-hero'){if(!edit){if(activePageId)editContentPage(activePageId);else baseHandleAction('edit');}selected={kind:'hero'};inspectorMode='settings';preview=false;render();returnToTop();return;}
  if(a==='hero-image'){if(!edit||!assets[v])return;mutate(()=>edit.hero={...heroFor(edit),image:v});return;}
  if(a==='page-settings'&&activePageId){selected={kind:'page'};inspectorMode='settings';refreshProps();return;}
  if(a==='add-page-link'){const b=selected?.kind==='block'?blockFind(selected.id)?.b:null,target=root.querySelector('#hc-page-link-target')?.value,r=target?pageRecord(target.slice(5)):null;if(b?.type==='links'&&r?.published){if(b.links.split('\n').filter(Boolean).length>=8){toast('This links block is full. Add another links block.');return;}mutate(()=>b.links+='\n'+r.published.title+' | Open page | '+target,'Page link added.');}return;}
  if(a==='page-actions'){const r=pageRecord(v),d=r?.draft||r?.published;if(!d)return;openDialog(esc(d.title),'Manage this company page',`<div class="hc-stack"><div class="hc-page-address">${esc(pageAddress(v,d))}</div>${B('Duplicate as a new draft','duplicate-page','copy','',v)}${r.draft?B('Delete saved draft','delete-page-draft','trash-2','',v):''}</div>`,B('Close','close'));return;}
  if(a==='duplicate-page'){const r=pageRecord(v),d=clone(r.draft||r.published);d.title+=' — copy';activePageId='page-'+Date.now().toString(36);edit=d;selected={kind:'page'};inspectorMode='settings';history=[clone(d)];future=[];newPagePending=true;preview=false;close();render();returnToTop();return;}
  if(a==='delete-page-draft'){openDialog('Delete this saved draft?','Only the unpublished draft will be removed.',`<p class="hc-small hc-muted">Only the saved draft is removed from this mockup.</p>`,B('Keep draft','close')+B('Delete draft','confirm-delete-page-draft','trash-2','',v));return;}
  if(a==='confirm-delete-page-draft'){const r=pageRecord(v);if(r.published)state.pageRecords[v]={published:r.published,draft:null,revision:r.revision};else delete state.pageRecords[v];close();activePageId=null;state.tab='pages';persist();render();toast('Saved draft deleted.');return;}
  if(a==='save-draft'&&activePageId){if(!safeDraftSize(edit)){toast('This mockup is full. Shorten the draft or remove an unused draft.');return;}const r=pageRecord(activePageId)||{published:null,revision:0};state.pageRecords[activePageId]={published:r.published,draft:compactDoc(edit),revision:r.revision};newPagePending=false;history=[];future=[];persist();render();toast('Page draft saved. Staff still see the published version.');return;}
  if(a==='publish'&&edit){pagePublishDialog();return;}
  if(a==='publish-content-page'&&edit){if(publicationIssues(edit).length)return;const candidate=clone(state);if(activePageId){const r=pageRecord(activePageId)||{revision:0};candidate.pageRecords[activePageId]={published:compactDoc(edit),draft:null,revision:r.revision+1};}else{candidate.published=compactDoc(edit);candidate.draft=null;candidate.revision++;}if(!fitsStorage(candidate)){toast('This mockup is full. Shorten the draft or remove an unused draft.');return;}state=candidate;close();edit=null;preview=false;selected=null;history=[];future=[];newPagePending=false;persist();render();returnToTop();toast('Published in the mockup. All staff can now read this page.');return;}
  if(a==='cancel'&&activePageId){if(history.length||newPagePending)openDialog('Leave this page draft?','Your published page will stay as it is.',`<p class="hc-small hc-muted">Unsaved changes will be discarded. Any previously saved draft stays available in Pages.</p>`,B('Keep editing','close')+B('Discard unsaved changes','discard-page-edit','x'));else finishPageEditing();return;}
  if(a==='discard-page-edit'){close();finishPageEditing();return;}
  if(a==='confirm-reset'&&activePageId){close();mutate(()=>{const fresh=makeContentPage(edit.title,edit.kind==='story'?'story':'information');edit=fresh.d;selected={kind:'page'};},'Page template restored.');return;}
  if(a==='nav'){if(edit)return;activePageId=null;if(v==='pages')pageFilter='all';}
  if(a==='role'){if(edit)return;if(v==='staff'){pageFilter='all';if(activePageId&&!pageRecord(activePageId)?.published)activePageId=null;}}
  if(a==='edit'&&activePageId){editContentPage(activePageId);return;}
  baseHandleAction(a,v,el);
};

function reverseDiff(before,after,path=[]){const ops=[];if(JSON.stringify(before)===JSON.stringify(after))return ops;if(before&&after&&typeof before==='object'&&typeof after==='object'&&Array.isArray(before)===Array.isArray(after)&&(!Array.isArray(before)||before.length===after.length)){for(const key of new Set([...Object.keys(before),...Object.keys(after)])){if(!(key in before))ops.push([path.concat(key)]);else if(!(key in after))ops.push([path.concat(key),before[key]]);else ops.push(...reverseDiff(before[key],after[key],path.concat(key)));}return ops;}return [[path,before]];}

function restoreVersion(revision){const id=historyId,r=documentRecord(id);if(['review','scheduled'].includes(workflow(id).status)){toast('Cancel the schedule or finish the review before restoring a version.');return;}if(r.draft){openDialog('A newer draft already exists','Keep it safe before restoring an earlier version.','<p>Open the existing draft and publish or delete it before restoring a version.</p>',B('Close','close')+B('Open existing draft','hm-edit-document','pencil','primary',id));return;}let d=r.published||r.archived,found=false;for(const v of state.versions[id]||[]){d=applyReverse(d,v.ops);if(v.revision===Number(revision)){found=true;break;}}if(!found)return;close();activePageId=id==='hub'?null:id;edit=clone(d);preview=false;selected={kind:activePageId?'page':'hero'};history=[clone(r.published)];future=[];state.tab=activePageId?'pages':'home';inspectorMode='settings';render();returnToTop();toast('Version restored as an unsaved draft. Review and publish when ready.');}
function applyPreviewClock(){const value=root.querySelector('#hm-clock')?.value;if(!value||!Number.isFinite(+new Date(value))){toast('Choose a valid preview date and time.');return;}if(new Date(value)<new Date(state.previewTime)){toast('Move the preview clock forward. Earlier publications are available in version history.');return;}const candidate=clone(state),changes=[];candidate.previewTime=value;for(const id of publicationIds()){let w=candidate.workflows[id];if(!w)continue;if(w.status==='scheduled'&&w.at<=value){const r=documentRecord(id,candidate);if(r.draft&&!publicationIssues(r.draft).length){const expires=w.expires;publishDocument(candidate,id,r.draft,expires);changes.push('Published '+r.draft.title);w=candidate.workflows[id];}}if(id!=='hub'&&w.status==='published'&&w.expires&&w.expires<=value){const r=documentRecord(id,candidate);writeRecord(candidate,id,{...r,draft:r.draft||r.published,archived:r.published,published:null});candidate.workflows[id]={...w,status:'expired'};changes.push('Expired '+(r.published?.title||'page'));}}if(!commitWithHistory(candidate))return;render();toast(changes.length?changes.join(' · '):'Preview clock updated. No scheduled changes were due.');}

 if(a.startsWith('hm-')&&!['hm-follow','hm-menu','hm-home'].includes(a)&&state.role!=='editor')return;

function profilePage(p){const manager=personBy(p.manager),reports=colleagues.filter(x=>x.manager===p.id),team=teamBy(p.department);return `<div class="hd-breadcrumb">${TB('People directory','hd-people-back','','arrow-left')}<span> / ${p.name}</span></div><div class="hd-profile-intro"><div class="hd-profile-top">${avatar(p.name)}<div><span class="hd-eyebrow">${teamName(p.department)}</span><h2>${p.name}</h2><p>${p.role} · ${p.site}</p></div>${B('Contact','hd-contact','message-circle','primary',p.id)}</div></div><div class="hd-profile"><div class="hc-stack"><section class="hd-surface hd-pad"><h3>About ${p.name.split(' ')[0]}</h3><p>${p.about}</p><h3 style="margin-top:22px">I can help with</h3><div class="hd-chips">${p.skills.map(s=>`<span class="hd-chip">${s}</span>`).join('')}</div></section><section class="hd-surface hd-pad"><h3>Where I fit</h3>${manager?`<small>Reports to</small><div style="margin:9px 0 16px">${compactPerson(manager)}</div>`:'<p>Leads the company leadership team.</p>'}${reports.length?`<small>Direct reports · ${reports.length}</small><div class="hd-profile-links" style="margin-top:9px">${reports.map(p=>compactPerson(p)).join('')}</div>`:''}${!reports.length?`<p>Part of ${teamName(p.department)}.</p>`:''}</section></div><aside class="hc-stack"><section class="hd-surface hd-pad"><h3>Work details</h3><div class="hd-contact-line">${I('mail')}<span><small>Work email · example</small>${personEmail(p)}</span></div><div class="hd-contact-line">${I('map-pin')}<span><small>Primary site</small>${p.site}</span></div><div class="hd-contact-line">${I('building-2')}<span><small>Team</small>${teamName(p.department)}</span></div></section>${team?`<section class="hd-surface hd-pad"><h3>Explore the team</h3><p>${team.summary}</p><div style="margin-top:14px">${B('Visit team space','hd-space','arrow-up-right','',team.id)}</div></section>`:''}</aside></div><footer class="hc-pagefoot"><span>Directory information comes from staff records.</span>${state.role==='editor'?TB( function serviceSubset(department='all'){return department==='all'?['it','leave','policy','hr'].map(id=>staffServices.find(s=>s.id===id)):staffServices.filter(s=>s.team===department);}

function servicePage(){if(requestId)return requestPage(requestId);const q=serviceSearch.toLowerCase(),items=staffServices.filter(s=>(serviceDepartment==='all'||s.team===serviceDepartment)&&(!q||(s.title+' '+s.summary).toLowerCase().includes(q)));return `<section class="hd-service-feature"><div><span class="hd-eyebrow">Staff service centre</span><h2>How can we help?</h2><p>Find the right service, start a request or get straight to the information you need.</p>${depthSearch('services','Staff services',serviceSearch,'What do you need help with?')}</div><aside><h3>A helpful place to start</h3>${TB('Explore the staff handbook','hd-article','handbook','book-open')}${TB('Meet our support teams','hd-route','teams','users-round')}${TB('My sample requests','hd-my-requests','','inbox')}</aside></section><nav class="hd-section-tabs" aria-label="Staff services"><button data-action="hd-service-view" data-value="services" aria-pressed="${serviceView==='services'}">Services</button><button data-action="hd-service-view" data-value="requests" aria-pressed="${serviceView==='requests'}">My requests <span class="hc-tag">${allRequests().length}</span></button></nav>${serviceView==='requests'?requestList():`<div class="hm-albums">${[['all','All services'],...companyTeams.map(t=>[t.id,t.name])].map(([id,name])=>`<button data-action="hd-service-filter" data-value="${id}" aria-pressed="${serviceDepartment===id}">${name}</button>`).join('')}</div>${serviceTiles(items)}`}<p class="hm-note">${I('flask-conical')}Requests and application links are demonstrations. Nothing is sent to a live team.</p>${companyFooter()}`;}
function allRequests(){return [...state.serviceRequests,...requestSamples];}

function requestPage(id){const r=allRequests().find(r=>r.id===id);if(!r)return depthEmpty('Request unavailable','Return to your requests to choose an example.');const s=staffServices.find(s=>s.id===r.service),owner=personBy(r.owner);return `<div class="hd-breadcrumb">${TB('My sample requests','hd-my-requests','','arrow-left')}<span> / ${r.id}</span></div>${heading('Sample request',esc(r.title),s.title+' · '+r.site,`<span class="hc-tag ${r.status==='Completed'?'success':''}">${r.status}</span>`)}<div class="hd-profile"><div class="hc-stack"><section class="hd-surface hd-pad"><h3>Your request</h3><p>${esc(r.detail)}</p></section><section class="hd-surface hd-pad"><h3>Activity</h3><div class="hd-timeline">${(r.activity||[['Sample request created',r.date],['Ready for the team to review','No live notification sent']]).map(([label,date])=>`<div><b>${esc(label)}</b><p>${esc(date)}</p></div>`).join('')}</div></section></div><aside class="hc-stack"><section class="hd-surface hd-pad"><h3>Looking after this</h3>${owner?compactPerson(owner):`<p>${teamName(s.team)} queue</p>`}<p style="margin-top:13px">${r.status==='Completed'?'This sample request is complete.':'You would receive updates here when the team responds.'}</p></section><section class="hd-surface hd-pad"><h3>While you’re here</h3>${TB(guideInfo(s.guide)?.title||'Read a guide','hd-article',s.guide,'book-open')}</section></aside></div>`;}
function showService(id){const s=staffServices.find(x=>x.id===id);if(!s)return;selectedService=s.id;if(s.mode==='knowledge'){routeDepth('resources');return;}if(s.mode==='handoff'){openDialog(s.title,'Continue in the existing application',`<div class="hd-dialog-highlight">${I(s.icon)} <strong>${esc(s.destination)}</strong><p style="margin-top:8px">${s.summary}</p></div><p class="hc-small hc-muted">This mockup previews the hand-off. Your existing ${s.team==='learning'?'learning':'HR'} workflow would open here.</p><div style="margin-top:18px">${TB('Read the guide first','hd-article',s.guide,'book-open')}</div>`,B('Back','close')+B('Preview destination','hd-handoff','arrow-up-right','primary',s.id));return;}requestDraft={service:id,title:'',detail:'',site:'Support office'};showRequestForm();}

function knowledgeRows(items){return `<div class="hd-surface">${items.map(k=>`<div class="hd-doc-row"><span class="hd-glyph">${I(k.kind==='Checklist'?'list-checks':k.kind==='Process'?'workflow':'book-open')}</span><button class="hd-doc-main" data-action="hd-article" data-value="${k.id}"><h3>${esc(k.title)}</h3><p>${esc(k.summary)}</p><small>${k.kind} · ${teamName(k.team)} · Updated ${k.doc.date}</small></button>${IB(state.bookmarks.includes('page:guide-'+k.id)?'Unsave '+k.title:'Save '+k.title,'hd-save-guide',state.bookmarks.includes('page:guide-'+k.id)?'bookmark-check':'bookmark',k.id)}</div>`).join('')||depthEmpty('No guides match those filters','Try another topic or a shorter search.','hd-knowledge-clear')}</div>`;}
function knowledgePage(){const q=knowledgeSearch.toLowerCase(),all=guideList(),items=all.filter(k=>(knowledgeTopic==='all'||k.team===knowledgeTopic)&&(knowledgeKind==='all'||k.kind===knowledgeKind)&&(!knowledgeSaved||state.bookmarks.includes('page:guide-'+k.id))&&(!q||(k.title+' '+k.summary+' '+k.topics.join(' ')).toLowerCase().includes(q)));return heading('Company knowledge','Find a useful answer','Practical guides, shared processes and checklists, with clear owners and review dates.',state.role==='editor'?B('New resource','hd-new-guide','plus','primary'):'')+`<div class="hd-toolbar">${depthSearch('knowledge','Knowledge library',knowledgeSearch,'Search guidance, processes and topics…')}<select data-depth-filter="knowledge-kind" aria-label="Filter knowledge by type">${[['all','All types'],['Guide','Guides'],['Process','Processes'],['Checklist','Checklists']].map(([id,name])=>`<option value="${id}" ${knowledgeKind===id?'selected':''}>${name}</option>`).join('')}</select><button class="hc-btn" data-action="hd-knowledge-saved" aria-pressed="${knowledgeSaved}">${I(knowledgeSaved?'bookmark-check':'bookmark')}Saved guides</button></div><div class="hd-knowledge-layout"><aside class="hd-taxonomy" aria-label="Knowledge topics"><h3>Browse by team</h3>${[['all','All knowledge','library'],...companyTeams.map(t=>[t.id,t.name,t.icon])].map(([id,name,icon])=>`<button data-action="hd-knowledge-topic" data-value="${id}" aria-pressed="${knowledgeTopic===id}">${I(icon)}<span>${name}</span><span>${all.filter(k=>id==='all'||k.team===id).length}</span></button>`).join('')}<div class="hm-note" style="padding:10px">${I('badge-check')}Every guide has an owner and a next review date.</div></aside><div><p class="hd-results-count">${items.length} ${items.length===1?'resource':'resources'}${knowledgeSaved?' · Saved by you':''}</p>${knowledgeRows(items)}</div></div>${companyFooter()}`;}
function articlePage(){
 const id=activePageId.slice(6),d=activeDoc(),seed=knowledgeSeeds.find(k=>k.id===id),record=pageRecord(activePageId);
 const k=preview?{id,title:d.title,summary:d.summary||d.tagline,team:d.department||'people',owner:d.owner||'ella',kind:d.docType||'Guide',record,checklist:d.docType==='Checklist'?(d.checklistText??seed?.checklist?.join('\n')??'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,12):null}:guideInfo(id);
 if(!k)return depthBase.dedicatedPage();
 const owner=personBy(k.owner)||personBy('ella'),blocks=d.sections.flatMap(s=>s.blocks.filter(b=>!b.hidden)),saved=state.bookmarks.includes('page:'+activePageId);
 const checklist=k.checklist?.length?`<div aria-label="Personal checklist">${k.checklist.map((label,n)=>`<label class="hd-checkitem"><input type="checkbox" data-guide-check="${id}:${n}" ${!preview&&(state.guideChecks[id]||[]).includes(n)?'checked':''} ${preview?'disabled':''}><span>${esc(label)}</span></label>`).join('')}</div><p class="hc-small hc-muted">${preview?'Staff can tick these steps in their personal reading view.':`${(state.guideChecks[id]||[]).filter(n=>n<k.checklist.length).length} of ${k.checklist.length} complete · Your preview progress`}</p>`:'';
 return `${preview?`<div class="hc-previewbar"><span class="hc-row">${I('eye')}Draft preview · Visible to editors only</span>${B('Back to designer','preview-back','pencil')}</div>`:`<div class="hd-breadcrumb">${TB('Knowledge library','hd-route','resources','arrow-left')}<span> / ${teamName(k.team)}</span></div>`}<div class="hd-doc-title"><div class="hc-row hc-between"><span class="hc-tag">${k.kind} · ${preview?'Unpublished draft':'Version '+k.record.revision}</span>${!preview?`<div class="hc-row">${B(saved?'Saved':'Save guide','hd-save-guide',saved?'bookmark-check':'bookmark','',id)}${state.role==='editor'?B(k.record.draft?'Continue draft':'Edit guide','edit-content-page','pencil','',activePageId):''}</div>`:''}</div><p style="margin-top:14px">${esc(k.summary)}</p><div class="hd-ownerbar" style="margin-bottom:0"><span>Updated ${esc(d.date)} · Owned by ${teamName(k.team)}</span><span>Next review ${esc(d.reviewDate||'12 Jan 2027')}</span></div></div><div class="hd-document"><article class="hd-article-body">${d.sections.map(s=>`<section class="hc-section hd-guide-section" data-tone="${s.tone}" aria-label="${esc(s.name)}"><div class="hd-guide-grid">${s.blocks.filter(b=>!b.hidden).map(b=>`<section class="hd-article-section" data-tone="${b.tone}" id="hd-section-${blocks.indexOf(b)}" style="grid-column:span ${b.width};min-height:${b.height||0}px"><h3>${esc(b.title)}</h3>${b.type==='text'?b.text.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join(''):blockContent(b)}${blocks.indexOf(b)===Math.min(1,blocks.length-1)?checklist:''}</section>`).join('')}</div></section>`).join('')}${!blocks.length?checklist:''}${!preview?`<div class="hd-feedback"><span>Was this useful?</span><button class="hc-btn" data-action="hd-helpful" data-value="${id}" aria-pressed="${state.helpfulGuides.includes(id)}">${I('thumbs-up')}${state.helpfulGuides.includes(id)?'Thanks for your feedback':'Yes, helpful'}</button>${TB('Report an issue','hd-report',id,'flag')}</div>`:''}</article><aside class="hd-article-side"><section><h3>On this page</h3><div class="hc-toc">${blocks.map((b,i)=>`<button data-action="hd-guide-jump" data-value="${i}">${esc(b.title)}</button>`).join('')}</div></section><section><h3>Content owner</h3>${compactPerson(owner)}<p style="margin-top:9px">The owner keeps this guide clear and up to date.</p></section>${!preview?`<section><h3>Related resources</h3>${guideList().filter(x=>x.id!==id&&x.team===k.team).slice(0,3).map(x=>`<button class="hd-resource-mini" data-action="hd-article" data-value="${x.id}">${I('file-text')}<span><b>${esc(x.title)}</b><small>${x.kind}</small></span></button>`).join('')}</section><section>${B('Ask the team','hd-service','message-circle','',k.team==='it'?'it':k.team==='people'?'hr':k.team==='learning'?'learning':'maintenance')}</section>`:''}</aside></div><footer class="hc-pagefoot"><span>${preview?'Draft · Editors only':'Sample company guidance · Fictional preview'}</span>${preview?TB('Back to designer','preview-back','','arrow-left'):TB('Visit '+teamName(k.team),'hd-space',k.team,'arrow-up-right')}</footer>`;
}


blockContent=function(b){if(b.type==='departments')return spaceCards(true,b.count||4);if(b.type==='services')return serviceTiles(serviceSubset(b.department).slice(0,b.count||4),true);if(b.type==='directory'){if(b.department&&b.department!=='all')return `<div class="hd-profile-links">${colleagues.filter(p=>p.department===b.department).slice(0,b.count||3).map(p=>compactPerson(p)).join('')}</div>`;return `<div class="hd-finder"><div class="hd-faces">${['ella','noah','daniel','sam'].map(id=>avatar(personBy(id).name)).join('')}</div><p>A name, a role or someone who can help. Find colleagues across every team.</p>${depthSearch('people-widget','Find a colleague','','Name, role or expertise')}${TB('Explore the directory','hd-route','directory','arrow-right')}</div>`;}if(b.type==='knowledge')return guideList().filter(k=>!b.department||b.department==='all'||k.team===b.department).slice(0,b.count||3).map(k=>`<button class="hd-resource-mini" data-action="hd-article" data-value="${k.id}">${I(k.kind==='Checklist'?'list-checks':'file-text')}<span><b>${esc(k.title)}</b><small>${k.kind} · ${teamName(k.team)}</small></span></button>`).join('')||'<p class="hc-small hc-muted">Published guides will appear here.</p>';if(b.type==='news'&&b.department&&b.department!=='all'){const items=allStoryItems().filter(s=>pageRecord(s.id)?.published?.department===b.department&&pageRecord(s.id).published.showInNews!==false).slice(0,b.count||2);return items.length?newsMarkup(items,items.length===1?'list':b.layout):'<p class="hc-small hc-muted">Publish a team update to show it here.</p>';}return depthBase.blockContent(b);};
blockMarkup=function(b,editing=false){let html=depthBase.blockMarkup(b,editing);if(!editing&&['departments','services','directory','knowledge'].includes(b.type))html=html.replace(`</h2></div>`,`</h2>${TB('See all','hd-block-more',b.type+':'+(b.department||'all'))}</div>`);if(!editing&&b.type==='news'&&b.department&&b.department!=='all')html=html.replace(TB('See all','nav','news'),TB('See all','hd-block-more','news:'+b.department));return html;};

properties=function(){

 if(activePageId&&inspectorMode==='settings'&&(!selected||selected.kind==='page')&&['knowledge','department'].includes(d.kind)){
  const pf=(...args)=>field(...args).replaceAll('data-prop=','data-page-prop='),resource=d.kind==='knowledge';

 }
 let html=depthBase.properties();const b=selected?.kind==='block'?blockFind(selected.id)?.b:null;
 if(b&&['services','directory','knowledge','news'].includes(b.type))html=html.replace('<div class="hc-propbody">','<div class="hc-propbody">'+field('Team content','department',b.department||'all','select',[['all','All teams'],...companyTeams.map(t=>[t.id,t.name])]));
 if(b&&['departments','services','directory','knowledge'].includes(b.type))html=html.replace('<div class="hc-propbody">','<div class="hc-propbody">'+field('Items to show','count',b.count||3,'select',[1,2,3,4]));
 if(activePageId&&inspectorMode==='settings'&&(!selected||selected.kind==='page'))html=html.replace('<div class="hc-propbody">','<div class="hc-propbody">'+field('Department','department',d.department||'','select',[['','Company-wide'],...companyTeams.map(t=>[t.id,t.name])]).replaceAll('data-prop=','data-page-prop='));
 return html;
};

spaceCards=function(compact=false,count=4){if(!compact)return polishBase.spaceCards(compact,count);return `<div class="hp-team-grid">${companyTeams.filter(t=>spaceRecord(t.id)?.published).sort((a,b)=>Number(state.followedTeams.includes(b.id))-Number(state.followedTeams.includes(a.id))).slice(0,count).map(t=>`<button class="hp-team-tile" data-action="hd-space" data-value="${t.id}">${photo(t.image,t.name)}<span><b>${esc(t.name)}</b><small>${esc(personBy(t.lead).name)} · Team lead</small></span>${I('arrow-up-right')}</button>`).join('')}</div>`;};
blockContent=function(b){if(b.type==='news'&&(!b.department||b.department==='all')){const featured=activeDoc().sections.flatMap(s=>s.blocks.filter(x=>x.type==='featured'&&!x.hidden)).flatMap(b=>{const id=b.pageId||'garden';return [id,...stories.filter(s=>s.id!==id).slice(0,2).map(s=>s.id)];});let pool=visibleStories().filter(s=>(b.filter==='all'||!b.filter||s.category===b.filter)&&!featured.includes(s.id));if(!pool.length)pool=visibleStories().filter(s=>b.filter==='all'||!b.filter||s.category===b.filter);return editorialNews(pool.slice(0,b.count||3),b.layout==='list'?'list':'cards');}return polishBase.blockContent(b);};

function commandResults(){const items=commandItems();return items.length?items.map((item,i)=>`<button class="hp-command-result" data-action="hp-command-go" data-value="${i}"><span class="hd-glyph">${I(item.icon)}</span><span><b>${esc(item.title)}</b><small>${esc(item.sub)}</small></span><em>${item.type}</em>${I('arrow-up-right')}</button>`).join(''):'<div class="hp-command-empty">No matches yet. Try a person, team or topic.</div>';}
function openCommand(){if(edit){toast('Save or leave the designer before opening another destination.');return;}commandQuery='';openDialog('Find your way','Search company content, people and services.',`<label class="hp-command-input">${I('search')}<input id="hp-command-input" aria-label="Search the company" placeholder="Try “leave”, “Noah” or “learning”…" autocomplete="off"></label><div id="hp-command-results" class="hp-command-results">${commandResults()}</div><div class="hp-command-hint"><span>↑ ↓ to move · Enter to open</span><span>Esc to close</span></div>`,B('Close','close'));root.querySelector('#hp-command-input')?.focus();}
function birthdayRecord(id){const p=personBy(id);birthdayPerson=id;openDialog('Staff record preview',p.name,`<div class="hc-person">${avatar(p.name)}<div><b>${p.name}</b><small>${p.role} · ${p.site}</small></div></div><div class="hc-propgroup"><h3>Birthday sharing</h3><p class="hc-small hc-muted">Birthdays stay off the hub until HR enables sharing for an individual. Only the day and month appear to staff.</p>${id==='aroha'?`<label class="hc-field" style="margin-top:16px">Preview permission<select aria-label="Birthday sharing permission" id="hp-birthday-permission"><option value="directory" ${!birthdayPermission?'selected':''}>Directory access</option><option value="hr" ${birthdayPermission?'selected':''}>HR · Manage birthday sharing</option></select></label><label class="hc-checkbox"><input id="hp-birthday-enabled" type="checkbox" ${state.birthdaySharing.includes(id)?'checked':''} ${!birthdayPermission?'disabled':''}>Show Aroha’s birthday on the hub</label><p class="hc-small hc-muted">Fictional birthday: 15 October</p>`:'<p class="hc-small" style="margin-top:14px">No birthday is configured for this fictional profile.</p>'}</div><p class="hm-note">This previews the existing HR record and its permission boundary. It changes no live staff data.</p>`,B('Close','close')+(id==='aroha'?B('Save visibility','hp-birthday-save','check','primary','',birthdayPermission?'':'disabled'):''));}

handleAction=function(a,v,el){
 if(a==='global-search'){openCommand();return;}
 if(a==='hd-staff-record'&&state.role==='editor'){birthdayPermission=false;birthdayRecord(v);return;}
 if(a==='hp-birthday-save'){if(state.role!=='editor'||!birthdayPermission||birthdayPerson!=='aroha')return;const c=clone(state),on=root.querySelector('#hp-birthday-enabled')?.checked;c.birthdaySharing=on?[...new Set([...c.birthdaySharing,birthdayPerson])]:c.birthdaySharing.filter(id=>id!==birthdayPerson);if(managementCommit(c,on?'Birthday sharing enabled for Aroha in the mockup.':'Birthday sharing is off for Aroha.')){close();render();}return;}
 if(a.startsWith('hp-')&&edit)return;
 if(['hp-create','hp-create-type','hp-write-story','hp-moderate','hp-hidden-comments'].includes(a)&&state.role!=='editor')return;
 if(a==='hp-create'){createMenu();return;}
 if(a==='hp-create-type'){close();if(v==='knowledge')newGuideDialog();else{createTemplate=v==='story'?'story':'information';creator();}return;}
 if(a==='hp-write-story'){createTemplate='story';creator();return;}
 if(a==='hp-news-category'){newsroomCategory=v;render();return;}
 if(a==='hp-news-layout'){newsroomLayout=v;render();return;}
 if(a==='hp-news-search'){newsroomSearch=root.querySelector('[data-polish-search="news"] input')?.value.trim()||'';render();return;}
 if(a==='hp-news-clear'){newsroomCategory='all';newsroomSearch='';render();return;}
 if(a==='hp-story-save'){const key='story:'+v,c=clone(state);c.bookmarks=c.bookmarks.includes(key)?c.bookmarks.filter(x=>x!==key):[...c.bookmarks,key];if(managementCommit(c,c.bookmarks.includes(key)?'Story saved for later.':'Story removed from saved.'))render();return;}
 if(a==='hp-story-conversation'){replyTo=null;showHiddenComments=false;openPage(v);root.querySelector('#hp-conversation')?.scrollIntoView({block:'start'});return;}
 if(a==='hp-story-like'){const c=clone(state);c.storyLikes=c.storyLikes.includes(v)?c.storyLikes.filter(x=>x!==v):[...c.storyLikes,v];if(managementCommit(c))render();return;}
 if(a==='hp-comment-post'){postComment(v);return;}
 if(a==='hp-reply'||a==='hp-cancel-reply'){const pending=root.querySelector('#hp-comment-text')?.value||'';replyTo=a==='hp-reply'?v:null;render();const field=root.querySelector('#hp-comment-text');if(field){field.value=pending;field.focus();}return;}
 if(a==='hp-moderate'){const c=clone(state);c.hiddenComments=c.hiddenComments.includes(v)?c.hiddenComments.filter(x=>x!==v):[...c.hiddenComments,v];if(managementCommit(c,'Comment visibility updated in the mockup.'))render();return;}
 if(a==='hp-hidden-comments'){showHiddenComments=!showHiddenComments;render();return;}
 if(a==='hp-remove-comment'){const item=state.storyComments.find(c=>c.id===v);if(item?.author!=='you')return;const c=clone(state);c.storyComments=c.storyComments.filter(x=>x.id!==v);if(managementCommit(c,'Your sample comment was removed.'))render();return;}
 if(a==='hp-command-go'){const item=commandItems()[Number(v)];if(!item)return;close();commandQuery='';handleAction(item.action,item.value,el);return;}
 if(['open-page','story','nav','hd-route','hm-follow','role'].includes(a)){replyTo=null;showHiddenComments=false;}
 polishBase.handleAction(a,v,el);
};

 });

function activityDialog(){

function noticeDialog(id){
 const r=noticeRecord(id),d=r?.published;if(!noticeActive(r)){toast('This announcement is no longer active.');return;}
 rememberSeen([noticeKey(id)]);render();
 const ack=state.hubAttention.ack[noticeKey(id)];
 openDialog(d.title,`${d.owner} · All staff`,`<div class="ha-notice-meta"><span class="hc-tag">Important announcement</span><span>${d.expires?'Available until '+formatTime(d.expires):'No expiry set'}</span></div><article class="ha-notice-body">${d.body.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}</article>${d.ackRequired?`<div class="ha-ack-state ${ack?'confirmed':''}">${I(ack?'circle-check':'circle-alert')}<span>${ack?'You confirmed you’ve read this · '+formatTime(ack):'Please confirm when you have read this announcement.'}</span></div>`:'<p class="hc-small hc-muted">For your information · No read confirmation needed.</p>'}`,B('Close','close')+(d.ackRequired&&!ack?B('I’ve read this','ha-ack','check','primary',id):''),'announcement');

}
manageShell=function(){
 const extra=`<button data-action="hm-tab" data-value="updates" aria-pressed="${manageTab==='updates'}">${I('megaphone')}Announcements</button>`;

createMenu=function(){attentionBase.createMenu();const grid=dialog.querySelector('.hp-create-grid');if(grid){grid.insertAdjacentHTML('beforeend',`<button data-action="ha-new"><span class="hd-glyph">${I('megaphone')}</span><b>Important announcement</b><p>Share a time-sensitive update, with an optional read confirmation.</p><span class="hp-create-arrow">Create an announcement ${I('arrow-right')}</span></button>`);icons();}};
function editNotice(id){
 if(state.role!=='editor'||edit)return;noticeEditing=id;
 const r=id?noticeRecord(id):null,d=r?.draft||r?.published||{title:'',body:'',owner:'People & Culture',expires:'',ackRequired:false};
 openDialog(id?'Edit announcement':'New announcement','A shared update for all staff.',`<div class="ha-notice-form"><label class="hc-field">Title<input id="ha-title" aria-label="Announcement title" maxlength="90" value="${esc(d.title)}" placeholder="What do people need to know?"></label><label class="hc-field">Announcement<textarea id="ha-body" aria-label="Announcement text" rows="5" maxlength="900" placeholder="Keep it clear, useful and concise.">${esc(d.body)}</textarea></label><div class="hc-two"><label class="hc-field">Published by<select id="ha-owner" aria-label="Announcement owner">${companyTeams.map(t=>`<option ${t.name===d.owner?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label class="hc-field">Expires (optional)<input type="datetime-local" id="ha-expiry" aria-label="Announcement expiry" value="${esc(d.expires||'')}"></label></div><label class="hc-checkbox"><input type="checkbox" id="ha-required" ${d.ackRequired?'checked':''}>Ask staff to confirm they’ve read this</label><p class="hc-small hc-muted">${r?.published?'Publishing changes creates a new version and asks for a fresh confirmation when required.':'An expiry automatically removes the update from staff view.'}</p><p id="ha-form-error" class="hm-error" role="alert"></p></div>`,B('Cancel','close')+B('Save draft','ha-save-notice','save','','draft')+(state.publishPermission!=='author'?B('Publish announcement','ha-save-notice','send','primary','publish'):''),'announcement-editor');
}
function saveNotice(publish){
 if(state.role!=='editor'||(publish&&state.publishPermission==='author'))return;
 const d={title:dialog.querySelector('#ha-title').value.trim(),body:dialog.querySelector('#ha-body').value.trim(),owner:dialog.querySelector('#ha-owner').value,expires:dialog.querySelector('#ha-expiry').value,ackRequired:dialog.querySelector('#ha-required').checked};
 const error=!d.title||d.title.length<3?'Add a clear title of at least three characters.':d.body.length<15?'Add an announcement of at least fifteen characters.':d.expires&&(!Number.isFinite(+new Date(d.expires))||d.expires<=attentionNow())?'Choose an expiry after the preview time, or leave it blank.':!noticeEditing&&Object.keys(state.hubAttention.notices).length>=5?'This preview holds five custom announcements. Edit an existing one.':'';
 if(error){dialog.querySelector('#ha-form-error').textContent=error;return;}
 const id=noticeEditing||'notice-'+Date.now().toString(36),r=noticeRecord(id)||{published:null,draft:null,revision:0},c=clone(state);
 c.hubAttention.notices[id]=publish?{published:{...d,posted:attentionNow()},draft:null,revision:r.revision+1}:{...r,draft:d};
 if(!managementCommit(c,publish?'Announcement published in the mockup.':'Announcement draft saved.'))return;
 close();activePageId=null;state.tab='manage';manageTab='updates';render();returnToTop();
}
function decorateNewContent(){
 const keys=new Map(newActivity().filter(x=>x.type!=='home').map(x=>[x.id,x]));
 root.querySelectorAll('[data-action="open-page"],[data-action="hd-article"]').forEach(button=>{const id=button.dataset.action==='hd-article'?'guide-'+button.dataset.value:button.dataset.value;if(!keys.has(id))return;const label=button.querySelector('.hp-eyebrow')||button.querySelector('h3');if(label&&!label.querySelector('.ha-new-tag'))label.insertAdjacentHTML('beforeend','<span class="ha-new-tag">New</span>');});
 const bell=root.querySelector('[data-action="notifications"]');if(bell){bell.setAttribute('aria-label','Company updates');if(newActivity().length)bell.insertAdjacentHTML('beforeend','<span class="ha-bell-dot" aria-hidden="true"></span>');}
}
function setupCompactNavigation(){
 const main=root.querySelector('.hc-main'),rail=root.querySelector('.hp-hub-nav'),hero=root.querySelector('.hp-connected-hero');if(!main||!rail||!hero)return;
 const update=()=>{rail.dataset.stuck=String(hero.getBoundingClientRect().bottom<=main.getBoundingClientRect().top+46);};

render=function(){
 const main=root.querySelector('.hc-main'),oldScroll=main?.scrollTop||0,key=(activePageId||state.tab)+'|'+isEditing();
 attentionBase.render();const next=root.querySelector('.hc-main');if(next&&attentionRenderKey===key)next.scrollTop=oldScroll;attentionRenderKey=key;
 if(!isEditing()){decorateNewContent();setupCompactNavigation();}icons();
};
returnToTop=function(){const main=root.querySelector('.hc-main');if(root.dataset.reading==='true'&&main)main.scrollTop=0;else attentionBase.returnToTop();};
handleAction=function(a,v,el){
 ensureAttention();
 if((a.startsWith('ha-')||a==='notifications')&&(edit||preview)){toast('Leave the designer to open company updates.');return;}
 if(['ha-new','ha-edit','ha-save-notice','ha-unpublish'].includes(a)&&state.role!=='editor')return;
 if(a==='notifications'||a==='ha-activity'){activityFilter='new';activityDialog();return;}
 if(a==='ha-feed-filter'){activityFilter=v;activityDialog();return;}
 if(a==='ha-notice'){noticeDialog(v);return;}
 if(a==='ha-open-item'){const item=activityItems().find(x=>x.key===v);if(!item)return;if(item.type==='home')noticeDialog(item.id);else{close();openPage(item.id);}return;}
 if(a==='ha-seen-all'){const keys=newActivity().map(x=>x.key);if(!keys.length)return;activityUndo=keys;if(rememberSeen(keys)){render();activityDialog();}return;}
 if(a==='ha-undo-seen'){if(!activityUndo)return;const c=clone(state);c.hubAttention.seen=c.hubAttention.seen.filter(key=>!activityUndo.includes(key));if(managementCommit(c)){activityUndo=null;render();activityDialog();}return;}
 if(a==='ha-ack'){const r=noticeRecord(v);if(!noticeActive(r)||!r.published.ackRequired)return;const c=clone(state);c.hubAttention.ack[noticeKey(v)]=attentionNow();if(managementCommit(c,'Your read confirmation was recorded in the mockup.')){render();noticeDialog(v);}return;}
 if(a==='ha-new'){editNotice(null);return;}
 if(a==='ha-edit'){editNotice(v);return;}
 if(a==='ha-save-notice'){saveNotice(v==='publish');return;}
 if(a==='ha-unpublish'){if(state.publishPermission==='author')return;const r=noticeRecord(v);if(!r?.published)return;const c=clone(state);c.hubAttention.notices[v]={...r,draft:r.draft||r.published,published:null};if(managementCommit(c,'Announcement unpublished. Its content is kept as a draft.'))render();return;}
 attentionBase.handleAction(a,v,el);
};
stateEnvelope=function(candidate=state){const result=attentionBase.stateEnvelope(candidate);result.modelContent={...result.modelContent,hubImprovements:['Compact sticky navigation','Important announcements and read confirmations','New since last visit']};return result;};

// Clearer discovery and a useful, searchable updates centre.
const refinementBase={connectedNavigation,homeWelcome,handleAction,noticeDialog,render};
let updateSearch='';
const hubDestinations={
 home:['house','Your shared company home'],news:['newspaper','Stories from across our company'],shoutouts:['heart-handshake','Recognise someone’s good work'],events:['calendar-days','What’s coming up, and who’s going'],resources:['book-open','Guides, policies and useful answers'],pages:['panels-top-left','Explore shared company pages'],saved:['bookmark','Your stories and guides for later'],teams:['building-2','Meet the teams behind our work'],directory:['users-round','Find a colleague or expertise'],services:['concierge-bell','Get support and follow your requests']
};
function hubDiscoveryLink(n){
 const page=n.target?.startsWith('page:')?pageRecord(n.target.slice(5))?.published:null,[icon,description]=hubDestinations[n.target]||['file-text',page?.summary||page?.tagline||'Open company page'];
 return `<button class="hr-discovery-link cursor-interaction" data-action="hm-follow" data-value="${esc(n.target)}" ${activePageId?n.target==='page:'+activePageId?'aria-current="page"':'':state.tab===n.target?'aria-current="page"':''}><span class="hr-discovery-icon">${I(icon)}</span><span><b>${esc(n.label)}${unreadTarget(n.target)?'<i class="hr-new-dot" aria-label="New updates"></i>':''}</b><small>${esc(description.slice(0,95))}</small></span>${I('arrow-up-right')}</button>`;
}
connectedNavigation=function(limit=Infinity){
 let html=refinementBase.connectedNavigation(limit);
 if(navMenu!=='hub-rail-more'||!Number.isFinite(limit))return html;
 const items=state.navigation.filter(navVisible),overflow=items.filter(n=>!n.parent).slice(limit);
 if(!overflow.length)return html;
 const menu=`<div class="hm-nav-menu hr-mega-menu"><div class="hr-mega-head"><span>Explore your hub</span><small>People, information & everyday support</small></div><div class="hr-mega-links">${overflow.flatMap(n=>n.group?items.filter(c=>c.parent===n.id):[n]).map(hubDiscoveryLink).join('')}</div></div>`;
 return html.replace(/<div class="hm-nav-menu">[\s\S]*?<\/div>(?=<\/div><\/nav>$)/,menu);
};
homeWelcome=function(){return refinementBase.homeWelcome().replace('<span class="hp-eyebrow">Across our company</span><h2>Good things happen together.</h2>','<h2>From across the company</h2>');};
function updateBookmark(item){return item.type==='news'?'story:'+item.id:item.type==='resources'?'page:'+item.id:null;}
function updateSaved(item){const key=updateBookmark(item);return key&&state.bookmarks.includes(key);}
function filteredUpdates(){
 const q=updateSearch.trim().toLowerCase();
 return activityItems().filter(item=>(activityFilter==='all'||activityFilter==='new'&&isUnseen(item)||activityFilter==='attention'&&item.required||activityFilter==='saved'&&updateSaved(item))&&(!q||(item.title+' '+item.owner+' '+item.kind).toLowerCase().includes(q)));
}
function updateRow(item){
 const fresh=isUnseen(item),saved=updateSaved(item),story=item.type==='news'?pageRecord(item.id)?.published:null;
 return `<article class="hr-update-row"><button class="hr-update-open" data-action="ha-open-item" data-value="${esc(item.key)}">${story?`<span class="hr-update-thumbnail">${photo(heroFor(story).image,'')}</span>`:`<span class="hr-update-glyph">${I(item.icon)}</span>`}<span class="hr-update-copy"><span class="hr-update-overline">${esc(item.owner)}${fresh?'<span class="ha-new-tag">New</span>':''}</span><b>${esc(item.title)}</b><small>${item.required?'<span class="hr-required">Read confirmation needed</span>':item.type==='home'?'Company announcement':item.kind}${!item.required&&item.date?' · '+esc(item.type==='home'?formatTime(item.date):item.date):''}</small></span></button><div class="hr-update-actions">${updateBookmark(item)?`<button class="hc-iconbtn" data-action="hr-save-update" data-value="${esc(item.key)}" aria-label="${saved?'Unsave':'Save'} ${esc(item.title)}" aria-pressed="${!!saved}" data-tooltip="${saved?'Remove from saved':'Save for later'}">${I(saved?'bookmark-check':'bookmark')}</button>`:''}${fresh?`<button class="hc-iconbtn" data-action="hr-see-update" data-value="${esc(item.key)}" aria-label="Mark ${esc(item.title)} as seen" data-tooltip="Mark as seen">${I('check')}</button>`:'<span class="hr-seen" aria-label="Seen">'+I('check-check')+'</span>'}</div></article>`;
}
function updateResults(){
 const items=filteredUpdates();
 if(!items.length){const searching=!!updateSearch.trim();return `<div class="ha-feed-empty">${I(searching?'search':activityFilter==='attention'?'circle-check':activityFilter==='saved'?'bookmark':'check-check')}<h3>${searching?'No matching updates':activityFilter==='attention'?'Nothing needs your confirmation':activityFilter==='saved'?'Keep something for later':'You’re all caught up.'}</h3><p>${searching?'Try a different word, title or team.':activityFilter==='saved'?'Save a story or guide using its bookmark button.':activityFilter==='attention'?'Required announcements will appear here.':'New stories, guides and announcements will appear here.'}</p>${searching?B('Clear search','hr-clear-search','x'):''}</div>`;}
 return [['home','Important announcements'],['news','Company stories'],['resources','Guides & resources']].map(([type,label])=>{const group=items.filter(item=>item.type===type);return group.length?`<section class="hr-feed-group"><h3>${label}<span>${group.length}</span></h3>${group.map(updateRow).join('')}</section>`:'';}).join('');
}
function updateFooter(){const fresh=filteredUpdates().filter(isUnseen).length;return `<span class="hr-feed-footnote">Seen indicators don’t confirm required reading.</span><div class="hc-row">${B('Close','close')}${fresh?B('Mark shown as seen','hr-see-shown','check-check','primary'):''}</div>`;}
function refineUpdateControls(){const count=filteredUpdates().length;dialog.querySelector('#hr-update-count').textContent=count+' update'+(count===1?'':'s');dialog.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));}
function refreshUpdateResults(){const results=dialog.querySelector('#hr-update-results');if(!results)return;results.innerHTML=updateResults();dialog.querySelector('.hc-dialog-foot').innerHTML=updateFooter();refineUpdateControls();icons();}
activityDialog=function(){
 const all=activityItems(),pending=all.filter(item=>item.required),count=all.filter(isUnseen).length;
 openDialog('Your company updates',`Since your last visit · ${visitLabel}`,`<div class="hr-update-summary"><span>${count?`<b>${count}</b> new updates to explore`:'You’ve caught up with the latest updates'}</span>${pending.length?`<button data-action="ha-feed-filter" data-value="attention">${I('circle-alert')}${pending.length} to confirm ${I('arrow-right')}</button>`:`<span class="hr-confirmed">${I('circle-check')}No confirmations pending</span>`}</div><div class="ha-feed-tabs hr-feed-tabs" aria-label="Update filters">${[['new','New',count],['attention','Needs attention',pending.length],['saved','Saved',all.filter(updateSaved).length],['all','All updates',all.length]].map(([key,label,n])=>`<button data-action="ha-feed-filter" data-value="${key}" aria-pressed="${activityFilter===key}">${label}<span>${n}</span></button>`).join('')}</div><label class="hr-update-search">${I('search')}<input id="hr-update-search" aria-label="Search your updates" placeholder="Search a title, topic or team…" value="${esc(updateSearch)}" autocomplete="off"><span id="hr-update-count" aria-live="polite">${filteredUpdates().length} updates</span></label><div id="hr-update-results">${updateResults()}</div>${activityUndo?`<div class="ha-undo-line">Updates marked as seen. ${TB('Undo','ha-undo-seen','','undo-2')}</div>`:''}`,updateFooter(),'activity');
 dialog.dataset.refinement='updates';
 refineUpdateControls();
};
noticeDialog=function(id){
 refinementBase.noticeDialog(id);
 if(!dialog.open||dialogKind!=='announcement')return;
 dialog.removeAttribute('data-refinement');
 const foot=dialog.querySelector('.hc-dialog-foot');if(foot){foot.insertAdjacentHTML('afterbegin',B('Back to updates','hr-back-updates','arrow-left','ghost'));icons();}
};
root.addEventListener('input',event=>{if(event.target.id==='hr-update-search'){updateSearch=event.target.value;refreshUpdateResults();}});
root.addEventListener('click',event=>{if(navMenu&&!event.target.closest('.hp-hub-nav')&&!dialog.open&&!edit){navMenu='';fitConnectedNavigation();}});
handleAction=function(a,v,el){
 if(a.startsWith('hr-')&&(edit||preview))return;
 if(a==='ha-activity'||a==='notifications')updateSearch='';
 if(a==='hr-clear-search'){updateSearch='';activityDialog();dialog.querySelector('#hr-update-search')?.focus();return;}
 if(a==='hr-back-updates'){activityFilter='attention';updateSearch='';activityDialog();return;}
 if(a==='hr-save-update'){
  const item=activityItems().find(x=>x.key===v),key=item&&updateBookmark(item);if(!key)return;const c=clone(state);c.bookmarks=c.bookmarks.includes(key)?c.bookmarks.filter(k=>k!==key):[...c.bookmarks,key];if(managementCommit(c)){render();activityDialog();}return;
 }
 if(a==='hr-see-update'||a==='hr-see-shown'){
  const keys=a==='hr-see-update'?activityItems().filter(item=>item.key===v&&isUnseen(item)).map(item=>item.key):filteredUpdates().filter(isUnseen).map(item=>item.key);if(!keys.length)return;
  if(rememberSeen(keys)){activityUndo=keys;render();activityDialog();}return;
 }
 refinementBase.handleAction(a,v,el);
};
render=function(){refinementBase.render();if(dialogKind!=='activity')dialog.removeAttribute('data-refinement');};
dialog.addEventListener('close',()=>dialog.removeAttribute('data-refinement'));

const libraryBase={reading,openPage,handleAction,normaliseHubSnapshot,articlePage,render,properties};
let resourceCollection='all',resourceView='cards',resourceSort='updated',resourceRecent=false,resourceCareFilter='open';
const resourceCollections=[
 {id:'starting',title:'A good start',description:'Find your feet and get connected',image:'team',topics:['Starting here','Getting connected']},
 {id:'working',title:'Working here',description:'People, wellbeing and everyday life',image:'garden',topics:['Working life','Wellbeing','Development']},
 {id:'together',title:'Better together',description:'Shared spaces, tools and teamwork',image:'workplace',topics:['Working together','Digital tools','Shared spaces','Our sites']}
];
function ensureLibrary(){state.hubLibrary??={};state.hubLibrary.recent??=[];}
ensureLibrary();
normaliseHubSnapshot=function(incoming){libraryBase.normaliseHubSnapshot(incoming);ensureLibrary();};
function resourceDate(value){const n=Date.parse(value||'');return Number.isFinite(n)?n:null;}
function resourceReview(k){const due=resourceDate(k.doc.reviewDate),now=resourceDate(attentionNow().slice(0,10));return {due,overdue:due!==null&&now!==null&&due<now,label:due===null?'Review date not set':due<now?'Review due':'Next review '+k.doc.reviewDate};}
function matchesCollection(k,id=resourceCollection){const c=resourceCollections.find(x=>x.id===id);return !c||(k.doc.resourceCollection?k.doc.resourceCollection===id:k.topics.some(t=>c.topics.includes(t)));}
function resourceItems(){
 const q=knowledgeSearch.trim().toLowerCase(),items=guideList().filter(k=>(knowledgeTopic==='all'||k.team===knowledgeTopic)&&(knowledgeKind==='all'||k.kind===knowledgeKind)&&matchesCollection(k)&&(!knowledgeSaved||state.bookmarks.includes('page:guide-'+k.id))&&(!resourceRecent||state.hubLibrary.recent.includes(k.id))&&(!q||[k.title,k.summary,...k.topics,teamName(k.team),personBy(k.owner)?.name].join(' ').toLowerCase().includes(q)));
 return items.sort((a,b)=>resourceRecent?state.hubLibrary.recent.indexOf(a.id)-state.hubLibrary.recent.indexOf(b.id):resourceSort==='title'?a.title.localeCompare(b.title):(resourceDate(b.doc.date)||0)-(resourceDate(a.doc.date)||0)||a.title.localeCompare(b.title));
}
function resourceCard(k){
 const owner=personBy(k.owner),saved=state.bookmarks.includes('page:guide-'+k.id),review=resourceReview(k),item=activityItems().find(x=>x.id==='guide-'+k.id),fresh=item&&isUnseen(item);

// Lossless packing keeps the expanded demo inside the host's 16 KiB snapshot limit.
// Legacy, unpacked snapshots remain readable. No content is discarded to make room.
function packHubData(value){
 const input=new TextEncoder().encode(JSON.stringify(value)),dictionary=new Map(),codes=[];let next=256,phrase='';
 for(const byte of input){const char=String.fromCharCode(byte),joined=phrase+char;if(!phrase||dictionary.has(joined)){phrase=joined;continue;}codes.push(phrase.length===1?phrase.charCodeAt(0):dictionary.get(phrase));if(next<65536)dictionary.set(joined,next++);phrase=char;}
 if(phrase)codes.push(phrase.length===1?phrase.charCodeAt(0):dictionary.get(phrase));
 let binary='';for(const code of codes)binary+=String.fromCharCode(code>>8,code&255);return btoa(binary);
}
function unpackHubSnapshot(value){
 if(value?.hubPacked!==1)return value;
 try{const binary=atob(value.data);if(binary.length%2||binary.length>100000)return null;const dictionary=Array.from({length:256},(_,i)=>String.fromCharCode(i));let previous='',output='',next=256;
 for(let i=0;i<binary.length;i+=2){const code=(binary.charCodeAt(i)<<8)|binary.charCodeAt(i+1),entry=dictionary[code]||(code===next&&previous?previous+previous[0]:null);if(entry===null)return null;output+=entry;if(output.length>250000)return null;if(previous&&next<65536)dictionary[next++]=previous+entry[0];previous=entry;}
 return JSON.parse(new TextDecoder().decode(Uint8Array.from(output,c=>c.charCodeAt(0))));
 }catch{return null;}
}
