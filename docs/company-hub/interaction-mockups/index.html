#hub-interactions .hi-home-attention p{font-size:12px;line-height:1.7;color:var(--hi-muted)}
#hub-interactions .hi-home-attention>.hi-button{flex-shrink:0}
#hub-interactions .hi-home-caught-up{display:flex;align-items:center;gap:9px;font-size:12px;padding:12px 0 24px;color:var(--hi-muted)}
#hub-interactions .hi-home-columns{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:35px}
#hub-interactions .hi-home-columns>aside{border-left:1px solid var(--hi-line);padding-left:28px;min-width:0}
#hub-interactions .hi-home-columns>div{min-width:0}
#hub-interactions .hi-home-columns section{margin-bottom:29px}
#hub-interactions .hi-section-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
#hub-interactions .hi-section-row h2,#hub-interactions .hi-home-small-heading{font-size:16px;font-weight:600;line-height:1.5}
#hub-interactions .hi-section-row .hi-link{font-size:11px;flex-shrink:0}
#hub-interactions .hi-home-event{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--hi-line)}
#hub-interactions .hi-home-event .hi-event-date{flex-shrink:0}
#hub-interactions .hi-home-event .hi-grow{min-width:0}
#hub-interactions .hi-home-event h3 .hi-link{font-size:14px;line-height:1.5;font-weight:500;padding:0;color:var(--hi-ink);text-align:left;white-space:normal}
#hub-interactions .hi-home-event p{font-size:11px;line-height:1.65;color:var(--hi-muted);margin:4px 0 7px}
#hub-interactions .hi-home-event>.hi-button{font-size:11px;flex-shrink:0;padding:7px 10px}
#hub-interactions .hi-home-story{background:var(--hi-surface);border-radius:10px;overflow:hidden}
#hub-interactions .hi-home-story-image{width:100%;height:190px;display:block;object-fit:cover}
#hub-interactions .hi-home-story>div{padding:19px 20px}
#hub-interactions .hi-home-story h3{margin:8px 0}
#hub-interactions .hi-home-story h3 .hi-link{font-size:21px;line-height:1.4;padding:0;color:var(--hi-ink);font-weight:500;text-align:left}
#hub-interactions .hi-home-story p{font-size:13px;line-height:1.75;color:var(--hi-muted);margin-bottom:12px}
#hub-interactions .hi-home-story small{font-size:11px;color:var(--hi-muted)}
#hub-interactions .hi-home-news-link{padding:18px 0;border-bottom:1px solid var(--hi-line)}
#hub-interactions .hi-home-news-link h3 .hi-link{font-size:15px;line-height:1.5;padding:0;color:var(--hi-ink);text-align:left;white-space:normal;margin:7px 0}
#hub-interactions .hi-home-news-link p{font-size:11px;color:var(--hi-muted)}
#hub-interactions .hi-home-saved{padding:13px 0;border-bottom:1px solid var(--hi-line)}
#hub-interactions .hi-home-saved>.hi-link{display:flex;flex-direction:row-reverse;align-items:start;text-align:left;justify-content:space-between;width:100%;font-size:13px;line-height:1.65;color:var(--hi-ink);padding:0}
#hub-interactions .hi-home-saved>.hi-link svg{width:15px;flex-shrink:0;margin-top:4px}
#hub-interactions .hi-home-saved small{display:block;margin-top:5px;font-size:11px;color:var(--hi-muted)}
#hub-interactions .hi-home-thanks{background:var(--hi-soft);padding:19px;border-radius:10px}
#hub-interactions .hi-home-thanks .hi-section-row>svg{color:var(--hi-accent);width:25px;height:25px}
#hub-interactions .hi-home-thanks b{font-size:12px;line-height:1.6;overflow-wrap:anywhere}
#hub-interactions .hi-home-thanks p{font-size:13px;line-height:1.85;margin:14px 0;overflow-wrap:anywhere;white-space:pre-line}
#hub-interactions .hi-dialog-head h2{overflow-wrap:anywhere}
#hub-interactions .hi-dialog-head p{line-height:1.7}
#hub-interactions .hi-window .hi-button{box-shadow:none}
#hub-interactions .hi-window .hi-dialog-foot>.hi-muted{font-size:11px}
@media(max-width:1120px){#hub-interactions .hi-reader-page .hi-dialog-content{padding:20px 23px 28px}#hub-interactions .hi-reader-page .hi-dialog-head{padding:20px 23px}#hub-interactions .hi-hub-navigation{padding:8px 16px}#hub-interactions .hi-hub-navigation button{padding:8px 13px}#hub-interactions .hi-reader-page .hi-dialog-head h2{font-size:23px}#hub-interactions .hi-people-grid{gap:0 20px}#hub-interactions .hi-directory-person{gap:10px;padding:18px 2px}#hub-interactions .hi-resource-browser{grid-template-columns:177px minmax(0,1fr);gap:23px}#hub-interactions .hi-home-columns{grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:25px}#hub-interactions .hi-home-columns>aside{padding-left:23px}#hub-interactions .hi-home-event{gap:10px}#hub-interactions .hi-news-story h3 .hi-link{font-size:17px}#hub-interactions .hi-event-list-action{min-width:145px}#hub-interactions .hi-event-list-item{gap:15px}}

 return view(event.title,event.summary,`<div class="hi-two-col"><div>${photo(event.image,'hi-photo',S.mediaDetails[event.image]?.alt||'Fictional shared workplace')}<article class="hi-reading"><h3>A little time together</h3><p>${esc(event.summary)}</p><p>This is a small, informal gathering for colleagues. Your host can help with practical questions before the day.</p><h3>Before you come</h3><p>Check the time and meeting place. If something would make it easier for you to take part, contact the host through their work profile.</p>${L('Meet your host','profile',event.host,'arrow-right')}</article></div><aside class="hi-event-booking">${facts([['calendar-days','Date',dateLabel(event.date)],['clock-3','Time',event.time+' · Pacific/Auckland'],['map-pin','Place',event.place],['user-round','Host',P(event.host).name]])}<div class="hi-event-action">${booking.registered?`${badge('You’re registered','good')}<p>Your place is reserved.</p>${L('Cancel registration','other-event-cancel',id)}`:booking.waitlisted?`${badge('You’re on the waitlist','warn')}<p>You don’t have a confirmed place yet.</p>${L('Leave waitlist','other-event-cancel',id)}`:`<b>${full?'Currently full':event.capacity-event.count+' places available'}</b>${B(full?'Join waitlist':'Count me in','other-event-book','primary',id)}`}</div></aside></div>`,L('Back to events','hub-back','','arrow-left'),'wide');
};
handlers['other-event-book']=id=>actionState('Your event choice was saved in this preview',()=>{const event=eventRecord(id);S.eventBookings[id]=event.count>=event.capacity?{waitlisted:true}:{registered:true};});
handlers['other-event-cancel']=id=>confirm('Leave this event?','Your registration or waitlist place will be removed in this preview.','Leave event',()=>{delete S.eventBookings[id];render();toast('Event choice removed');});

// Saved content links to its own record, including the expanded resource set.
handlers['saved-open']=title=>{const resource=hubResources.find(r=>r.title===title);if(resource)handlers['resource-open'](resource.id);else open(37,{step:1,form:{storyKey:newsroom.find(story=>story.title===title)?.key||'garden'}});};
const savedBeforeConnected=views[20];views[20]=()=>{const v=savedBeforeConnected();if(!S.tab||S.tab==='Saved')v.body=S.saved.length?`${tabs(['Saved','New','Needs attention','All activity'],'Saved')}${S.saved.map((title,index)=>{const resource=hubResources.find(r=>r.title===title);return `<div class="hi-item"><div class="hi-grow"><h3>${esc(title)}</h3><small>${resource?resource.type+' · '+resource.team:'Story · Company news'}</small></div>${B('Open','saved-open','',title)}${IB('Unsave '+title,'unsave-item','bookmark-x',String(index))}</div>`;}).join('')}`:v.body;return v;};

// Content-led home, driven by the local reading/participation state.
function homeContent(){
 const needsRead=S.ackVersion!==S.announcementVersion&&S.announcementState!=='Expired',next=eventRecord('garden'),saved=S.saved.slice(0,3),recognition=S.lastRecognition;
 return `<div class="hi-crumb">Company <span>›</span> Company Hub</div><div class="hi-hero"><div><span class="hi-label">OUR SHARED PLACE</span><h1>Together, at Oblivion</h1><p>Our people. Our stories. Our shared place.</p></div><span class="hi-ring" style="width:43px;height:43px"></span></div><div class="hi-home-nav">${hubNavigation()}</div><div class="hi-row hi-between hi-home-heading"><div><h2>Good morning, Jamie</h2><p class="hi-small hi-muted">Wednesday 14 October · Here’s what’s happening around you.</p></div>${B('Give a shout-out','open','primary','1','appreciation')}</div>${needsRead?`<section class="hi-home-attention"><div>${badge('Needs your confirmation','warn')}<h3>Visitor welcome guidance</h3><p>Read the current guidance and confirm version ${S.announcementVersion}.</p></div>${B('Read & confirm','open','','11','arrow-right')}</section>`:`<div class="hi-home-caught-up">${icon('circle-check')} You’re up to date with required reading.</div>`}<div class="hi-home-columns"><div><section><div class="hi-section-row"><h2>Coming up</h2>${L('All events','hub-nav','44','arrow-right')}</div><div class="hi-home-event">${eventDateChip(next)}<div class="hi-grow"><h3>${L(esc(next.title),'event-open','garden')}</h3><p>${next.time} · ${esc(next.place)}</p>${eventAvailability(next)}</div>${B('View event','event-open','','garden')}</div><div class="hi-home-event">${eventDateChip(eventRecord('learning'))}<div class="hi-grow"><h3>${L('A short learning circle','event-open','learning')}</h3><p>10–10:30 am · Company office</p>${eventAvailability(eventRecord('learning'))}</div></div></section><section><div class="hi-section-row"><h2>From around the Hub</h2>${L('All news','hub-nav','37','arrow-right')}</div><div class="hi-home-story">${photo('garden','hi-home-story-image','Colleagues planting together in the garden')}<div><span class="hi-label">OUR PEOPLE</span><h3>${L('Growing something good, together','read-story','garden')}</h3><p>A little time outdoors, a lot of shared care.</p><small>Jamie Rivers · 14 October</small></div></div><div class="hi-home-news-link"><span class="hi-label">LEARNING</span><h3>${L('One question, thirty minutes: a learning circle worth sharing','read-story','learning-circle')}</h3><p>Amelia-Rose Whitmore · 9 October</p></div></section></div><aside><section><div class="hi-section-row"><h2>Saved for later</h2>${L('View all','open','20')}</div>${saved.length?saved.map(title=>`<div class="hi-home-saved">${L(esc(title),'saved-open',title,'arrow-up-right')}<small>${hubResources.some(r=>r.title===title)?'Resource':'Company news'}</small></div>`).join(''):`<p class="hi-small hi-muted">Save a story or resource and it will be waiting here.</p>${L('Browse resources','hub-nav','36','arrow-right')}`}</section><section class="hi-home-thanks"><div class="hi-section-row"><h2>Worth a thank-you</h2>${icon('appreciation')}</div><div class="hi-row">${av(recognition?recognitionNames(recognition):'Mila Chen')}<b>${esc(recognition?recognitionNames(recognition):'Mila Chen & Noah Williams')}</b></div><p>“${esc(recognition?.message||'Thank you for helping our new colleagues feel welcome from their very first day.')}”</p>${L('Read shout-out','open','2','arrow-right')}</section><section><h2 class="hi-home-small-heading">Useful next steps</h2><div class="hi-stack hi-gap">${L('Find someone who can help','hub-nav','14')}${L('Share an idea','open','8')}${L('Staff services','open','18')}${L('Manage my interests','open','21')}</div></section></aside></div>`;
}
const shellBeforeConnected=shell;shell=function(){shellBeforeConnected();$('.hi-main').innerHTML=homeContent();};

// Presentation choices should not be treated as unsaved content edits.
const bindBeforeConnected=bindExtras;bindExtras=function(key,value,target){
 bindBeforeConnected(key,value,target);
 if(['resourceTeam','resourceType','resourceSaved','resourceRecent'].includes(key))S.dirty=false;
 if(key.startsWith('resourceCheck')){const id=S.form.resourceId,index=Number(key.slice(13)),previous=S.resourceChecks[id]||[];S.resourceChecks[id]=value?[...new Set([...previous,index])]:previous.filter(item=>item!==index);S.dirty=false;render();}
};

const renderBeforeConnected=render;
render=function(){
 const key=contextKey(),scroll=key===lastConnectedView?currentScroll():0;
 renderBeforeConnected();
 const windowEl=$('.hi-window'),backdrop=$('.hi-backdrop'),reading=readerRoutes.has(S.route),restore=restoringView;
 if(reading&&windowEl){
  windowEl.classList.remove('hi-task-drawer');windowEl.classList.add('hi-page-surface','hi-reader-page');backdrop.classList.remove('hi-drawer-backdrop');backdrop.classList.add('hi-page-backdrop');
  windowEl.setAttribute('role','main');windowEl.removeAttribute('aria-modal');windowEl.querySelector('.hi-dialog-head .hi-label')?.setAttribute('hidden','');
  $('#hi-shell').removeAttribute('inert');$('.hi-main').setAttribute('inert','');$('.hi-main').setAttribute('aria-hidden','true');
  windowEl.insertAdjacentHTML('afterbegin',hubNavigation());
  const back=windowEl.querySelector('.hi-dialog-head [data-action="close"]');if(back){back.className='hi-button quiet cursor-interaction';back.dataset.action='hub-back';back.removeAttribute('aria-label');back.innerHTML=icon('arrow-left')+' '+(navigationTrail.length?'Back to '+(sectionNames[navigationTrail.at(-1).route]||'previous page'):'Back to Hub');}
  if(isBrowseList())windowEl.querySelector('.hi-dialog-foot').hidden=true;
 }
 // Secondary task headings and duplicate decorative icons add no information.
 if(windowEl){
  windowEl.querySelector('.hi-dialog-head .hi-label')?.setAttribute('hidden','');
  windowEl.querySelectorAll('[data-action="rec-prompt"] svg').forEach(node=>node.remove());
  windowEl.querySelectorAll('[data-action="open"],[data-action="directory"],[data-action="news-back"]').forEach(button=>{if(/^Back to (people|resources|newsroom|guide|event)/i.test(button.textContent.trim()))button.dataset.action='hub-back';});
  windowEl.querySelectorAll('[data-action="news-topic"],[data-action="events-filter"]').forEach(button=>{button.classList.add('hi-filter-choice');button.setAttribute('aria-pressed',String(button.classList.contains('primary')));});
  windowEl.querySelectorAll('[data-action="news-layout"]').forEach(button=>button.setAttribute('aria-pressed',String((S.form.layout||'Cards')===button.dataset.value)));
 }
 const scrollElement=S.route===0?$('.hi-main'):$('.hi-dialog-content');if(scrollElement)scrollElement.scrollTop=restore?.scroll??scroll;
 if(restore?.focus){const target=$$(`[data-action="${CSS.escape(restore.focus.action)}"]${restore.focus.value===undefined?'':`[data-value="${CSS.escape(restore.focus.value)}"]`}`).find(element=>element.getClientRects().length&&!element.closest('[inert]'));target?.focus({preventScroll:true});}
 restoringView=null;lastConnectedView=key;icons();
};

const remembered=window.openai?.widgetState?.privateContent;if(remembered?.theme)S.theme=remembered.theme;
rememberDraft();render();
window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(p?.theme){S.theme=p.theme;render();}});
if(globalThis.Tweak){const settings={preview:true};const tweak=new Tweak({container:root,onChange:()=>{root.dataset.preview=settings.preview?'shown':'quiet';}});tweak.addToggle(settings,'preview',{label:'Recognition preview emphasis'});}
})();
</script>
</body></html>
