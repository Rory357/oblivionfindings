.has-breach .ao-action-label .ao-icon{background:var(--status-critical-bg);color:var(--status-critical);}
.ao-response h3{font-size:20px;line-height:1.35;font-weight:600;max-width:510px;}
.ao-ticket-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground);margin-top:9px;}
.ao-ticket-meta>span:nth-child(2){border-radius:6px;}
.ao-reason{font-size:13px;line-height:1.55;color:var(--muted-foreground);margin-top:13px;max-width:480px;}
.ao-response-clocks{display:grid;grid-template-columns:1fr 1fr;gap:16px;border-top:1px solid var(--border);padding-top:15px;margin-top:17px;margin-bottom:22px;}
.ao-sla-fact{font-size:13px;line-height:1.5;}.ao-sla-fact>span{display:block;font-size:11px;color:var(--muted-foreground);margin-bottom:4px;}.ao-sla-fact strong{font-weight:500;}.ao-sla-fact.critical strong{color:var(--status-critical);font-weight:600;}.ao-sla-fact.warning strong{color:var(--status-warning);font-weight:600;}
.ao-response-footer{display:flex;gap:15px;align-items:center;margin-top:auto;flex-wrap:wrap;}.ao-response-footer>[data-slot=button]{border-radius:9px;}.ao-response-footer>span{margin-left:auto;font-size:10.5px;color:var(--muted-foreground);}
.ao-text-action{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-size:12px;font-weight:500;border-radius:4px;white-space:nowrap;}.ao-text-action:hover{text-decoration:underline;}.ao-text-action svg{flex-shrink:0;}
.ao-side-actions{display:grid;grid-template-rows:1fr 1fr;gap:20px;min-width:0;}
.ao-small-action{padding:16px 18px;min-width:0;}
.ao-small-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;}.ao-small-top h3{font-size:13px;font-weight:600;line-height:1.4;}.ao-small-top .ao-icon{width:26px;height:26px;border-radius:8px;}.ao-icon-menu{margin-left:auto;width:28px;height:28px;border-radius:6px;color:var(--muted-foreground);display:grid;place-items:center;}.ao-icon-menu:hover{background:var(--muted);color:var(--foreground);}
.ao-ticket-link{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;text-align:left;line-height:1.4;border-radius:4px;}.ao-ticket-link svg{flex-shrink:0;color:var(--muted-foreground);}.ao-ticket-link:hover{color:var(--primary);}.ao-small-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--muted-foreground);font-size:11px;}
.ao-small-footer{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:13px;}.ao-small-footer>span{font-size:11px;color:var(--muted-foreground);}.ao-small-footer>[data-slot=button]{border-radius:8px;}.ao-small-footer .ao-assigned{display:flex;gap:6px;align-items:center;color:var(--status-success);font-weight:500;}
.ao-popover-title{font-family:var(--font-sans);font-size:11px;font-weight:500;color:var(--muted-foreground);padding:7px 8px;}.ao-priority-option{display:flex;align-items:center;gap:10px;font-family:var(--font-sans);font-size:13px;width:100%;padding:9px 8px;border-radius:6px;}.ao-priority-option b{margin-left:auto;font-size:12px;font-weight:500;}.ao-priority-option:hover{background:var(--muted);}
.ao-action-empty{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;flex:1;min-height:190px;}.ao-action-empty>svg{color:var(--muted-foreground);}.ao-action-empty h3{font-size:17px;}.ao-action-empty p,.ao-small-empty p{font-size:12px;color:var(--muted-foreground);}.ao-small-empty{display:flex;flex-direction:column;gap:14px;padding-top:12px;}
.ao-supporting{margin-top:20px;}.ao-list-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px;}.ao-list-heading h2{font-size:15px;font-weight:600;line-height:22px;}.ao-list-heading p{font-size:12px;color:var(--muted-foreground);margin-top:2px;}.ao-queue-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}.ao-queue-controls label{font-size:11px;color:var(--muted-foreground);}.ao-queue-controls select{font-family:var(--font-sans);font-size:12px;font-weight:500;background:var(--card);border:1px solid var(--input);border-radius:8px;padding:6px 8px;min-height:33px;max-width:225px;color:var(--foreground);cursor:pointer;}.ao-queue-controls>a{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--primary);margin-left:5px;}
.ao-list-surface{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px color-mix(in oklch,var(--foreground) 5%,transparent);}
.ao-list-surface .work-table th:first-child{width:43%;}.ao-list-surface .work-table th:nth-child(2){width:33%;}.ao-list-surface .work-table th:nth-child(3){width:19%;}.ao-list-surface .work-table th{border-top:0;}.ao-list-surface .work-table td{padding-top:13px;padding-bottom:13px;}.ao-list-surface .work-table .clock-line>span{display:inline;margin-right:6px;font-size:11px;}.ao-list-surface .work-table .clock-line{font-size:12px;margin:6px 0;}.ao-list-surface .ticket-title{font-size:14px;}.ao-list-surface .waiting-line{font-size:11.5px;margin-top:4px;}.ao-list-surface .ticket-meta{margin-top:5px;}
.ao-list-footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 18px;border-top:1px solid var(--border);color:var(--muted-foreground);font-size:11px;}.ao-list-footer>span{display:flex;align-items:center;gap:5px;}
.ao-empty-state{min-height:140px;padding:28px;display:flex;align-items:center;gap:16px;}.ao-empty-state>svg{color:var(--muted-foreground);flex-shrink:0;}.ao-empty-state>div{flex:1;}.ao-empty-state h3{font-size:14px;font-weight:600;}.ao-empty-state p{font-size:12px;color:var(--muted-foreground);margin-top:5px;max-width:480px;}
.ao-evidence{display:flex;align-items:center;gap:8px;margin-top:15px;color:var(--muted-foreground);font-size:12px;}.ao-evidence>svg{flex-shrink:0;}.ao-evidence p{flex:1;}.ao-evidence strong{font-weight:500;color:var(--foreground);}
.ao-activity{margin-top:20px;border-top:1px solid var(--border);padding-top:16px;}.ao-activity-title{display:flex;align-items:center;gap:7px;}.ao-activity-title>svg{color:var(--muted-foreground);}.ao-activity-title h2{font-size:13px;font-weight:600;}.ao-activity-title>span{margin-left:auto;color:var(--muted-foreground);font-size:11px;}.ao-activity-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:8px;}.ao-activity-grid button{text-align:left;padding:9px 0;color:var(--muted-foreground);font-size:12px;border-radius:5px;}.ao-activity-grid strong{color:var(--foreground);font-weight:500;}.ao-activity-grid small{display:flex;gap:6px;font-size:11px;margin-top:5px;}.ao-activity-grid button:hover{color:var(--primary);}
.ao-footer{display:flex;align-items:center;gap:14px;color:var(--muted-foreground);font-size:10.5px;border-top:1px solid var(--border);margin-top:14px;padding-top:13px;}.ao-footer strong{font-weight:500;}.ao-footer a{color:var(--primary);display:flex;gap:4px;align-items:center;}.ao-footer>span:last-child{margin-left:auto;}
@media(max-width:1320px){.ao-response{padding:18px;}.ao-response h3{font-size:18px;}.ao-response-footer{gap:12px;}.ao-response-footer>span{margin-left:0;width:100%;}.ao-actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}.ao-small-action{padding:14px 16px;}.ao-small-footer{margin-top:11px;}.ao-list-surface .work-table th:first-child{width:41%;}.ao-list-surface .work-table th:nth-child(2){width:35%;}.ao-list-surface .work-table th:nth-child(3){width:19%;}.ao-list-heading{align-items:flex-start;}.ao-queue-controls{gap:6px;}.ao-activity-grid{gap:16px;}}
