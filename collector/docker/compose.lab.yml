# Optional Docker path for A03 lab enrolment next to Herd on Windows.
# Docker Desktop is not required when using the local PHP proxy in
# docs/runbooks/monitoring/lab-collector-enrolment.md.
#
# Collector talks to the host-bound lab proxy (127.0.0.1:8443 published from
# the Windows PHP proxy, or the nginx service below). Herd stays on the host.

name: oblivion-lab-collector

services:
  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ../lab-state:/var/lib/oblivion-lab-collector
    working_dir: /opt/oblivion-monitoring-collector
    environment:
      OBLIVION_COLLECTOR_ENROLMENT_TOKEN: ${OBLIVION_COLLECTOR_ENROLMENT_TOKEN:-}
    entrypoint: ["php", "bin/oblivion-collector"]
    command: ["version"]

  proxy:
    image: nginx:1.27-alpine
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/lab.conf:/etc/nginx/conf.d/default.conf:ro
      - ../lab-state/ca.crt.pem:/etc/nginx/certs/ca.crt.pem:ro
      - ../lab-state/proxy.crt.pem:/etc/nginx/certs/proxy.crt.pem:ro
      - ../lab-state/proxy.key.pem:/etc/nginx/certs/proxy.key.pem:ro
