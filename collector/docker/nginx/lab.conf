# Lab-only. Not production reverse-proxy evidence.
server {
    listen 8443 ssl;
    server_name 127.0.0.1 localhost;

    ssl_certificate /etc/nginx/certs/proxy.crt.pem;
    ssl_certificate_key /etc/nginx/certs/proxy.key.pem;
    ssl_client_certificate /etc/nginx/certs/ca.crt.pem;
    ssl_verify_client optional;

    location = /api/monitoring/collectors/enrol {
        proxy_set_header X-Oblivion-Verified-Client-Certificate "";
        proxy_set_header X-Oblivion-Client-Certificate-Fingerprint "";
        proxy_set_header Host oblivionfindings.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass https://host.docker.internal;
    }

    location /api/monitoring/collectors/ {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }

        proxy_set_header X-Oblivion-Verified-Client-Certificate $ssl_client_escaped_cert;
        proxy_set_header X-Oblivion-Client-Certificate-Fingerprint "";
        proxy_set_header Host oblivionfindings.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass https://host.docker.internal;
    }

    location / {
        return 404;
    }
}
